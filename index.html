<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Validade-</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#071d49,#1265d8);color:#fff;padding:24px 18px 20px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0;opacity:.85}
main{max-width:620px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #102a4d14}
button{border:0;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#1265d8;color:#fff;width:100%}
.green{background:#16a36b;color:#fff;width:100%}
.whatsapp{background:#128c4a;color:#fff;width:100%}
.light{background:#eaf1fb;color:#17457f}
.danger{background:#feecec;color:#b42318;width:100%}
.actions{display:grid;gap:12px}
.muted{color:#68758a;font-size:14px}
.hidden{display:none!important}
input{width:100%;padding:13px;border:1px solid #ccd6e4;border-radius:11px;font-size:16px;margin-top:7px}
label{display:block;margin:13px 0;font-weight:700;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{background:transparent;color:#1265d8;padding:5px 0}
.listbox{border:1px solid #dce4ef;border-radius:13px;padding:13px;margin:10px 0}
.product{border:1px solid #dce4ef;padding:12px;background:#f7f9fc;border-radius:12px;margin-top:10px}
.badge{display:inline-block;background:#e8f4ff;color:#1265d8;border-radius:20px;padding:5px 9px;font-size:12px}
.camera{background:#101722;border-radius:16px;padding:14px;color:#fff;text-align:center}
.camera-title{font-size:15px;margin-bottom:10px}
.video-wrap{position:relative}
video{width:100%;height:300px;object-fit:cover;border-radius:11px;background:#05080d}
.scan-area{position:absolute;left:8%;right:8%;top:28%;height:44%;border:2px solid #31d78c;border-radius:10px;pointer-events:none}
.scan-area span{position:absolute;bottom:-28px;left:0;right:0;font-size:12px;color:#31d78c}
.scanline{height:3px;background:#31d78c;position:absolute;left:10%;right:10%;top:50%;border-radius:5px}
.photo-frame{position:absolute;left:5%;right:5%;top:35%;height:30%;border:2px solid #31d78c;border-radius:8px;pointer-events:none}
.photo-frame span{position:absolute;bottom:-28px;left:0;right:0;font-size:12px;color:#31d78c}
.status{padding:10px;border-radius:10px;background:#eef7f1;color:#17663f;font-size:14px;margin-top:10px}
.photo-preview{width:100%;aspect-ratio:2.4/1;object-fit:cover;border-radius:10px;margin-top:12px;border:1px solid #ccd6e4;background:#e9eef5}
.report-photo{width:180px;height:75px;object-fit:cover;border-radius:6px;border:1px solid #ccd6e4;display:block;margin:10px 0}
.step{font-size:13px;color:#68758a;margin:14px 0 6px;font-weight:700}
.code-number{font-size:18px;font-weight:700;letter-spacing:1px}
hr{border:0;border-top:1px solid #e3e8ef;margin:18px 0}
.report-actions{display:grid;gap:8px;margin-top:12px}
.pdf-status{font-size:13px;margin-top:8px;color:#68758a}
@media(max-width:480px){.row{grid-template-columns:1fr}video{height:270px}}
</style>
</head>

<body>

<header>
<h1>Validade-</h1>
<p>Controle de vencimentos</p>
</header>

<main id="app"></main>

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const KEY="validade_app_v6";

let db={lists:[]};
let current=null;
let stream=null;
let scanTimer=null;
let cameraMode="barcode";
let currentPhoto="";

/* =====================================================
   INICIALIZAÇÃO DO BANCO
===================================================== */

function loadData(){

 try{

  let saved=localStorage.getItem(KEY);

  /* compatibilidade com versões anteriores */
  if(!saved){
   saved=localStorage.getItem("validade_app_v5");
  }

  if(!saved){
   saved=localStorage.getItem("validade_app_v4");
  }

  if(saved){

   const parsed=JSON.parse(saved);

   if(parsed && Array.isArray(parsed.lists)){
    db=parsed;
   }

  }

 }catch(e){

  console.error("Erro ao carregar:",e);
  db={lists:[]};

 }

}

function save(){

 try{

  localStorage.setItem(KEY,JSON.stringify(db));

 }catch(e){

  alert("Não foi possível salvar os dados.");

 }

}

/* =====================================================
   UTILIDADES
===================================================== */

function app(){
 return document.getElementById("app");
}

function esc(value){

 return String(value??"")
 .replace(/[&<>"']/g,function(m){

  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[m];

 });

}

function formatDate(value){

 if(!value)return "";

 const p=String(value).split("-");

 if(p.length!==3)return value;

 return p[2]+"/"+p[1]+"/"+p[0];

}

/* =====================================================
   INÍCIO
===================================================== */

function home(){

 stopCam();

 current=null;
 currentPhoto="";

 app().innerHTML=`

 <section class="card">

  <h2>Início</h2>

  <p class="muted">
   Controle seus produtos e datas de validade.
  </p>

  <div class="actions">

   <button class="primary" onclick="newList()">
    ➕ Criar nova lista
   </button>

   <button class="light" onclick="lists()">
    📋 Minhas listas
   </button>

   <button class="light" onclick="reports()">
    📄 Relatório final
   </button>

   <button class="danger" onclick="clearData()">
    🗑 Limpar dados
   </button>

  </div>

 </section>

 <section class="card">

  <b>Como funciona</b>

  <p class="muted">
   A câmera lê o código de barras.
   Depois abre novamente para fotografar o produto.
   Informe a validade e a quantidade e salve.
  </p>

 </section>

 `;

}

/* =====================================================
   NOVA LISTA
===================================================== */

function newList(){

 app().innerHTML=`

 <section class="card">

  <div class="top">

   <h2>Nova lista</h2>

   <button class="back" onclick="home()">
    ← Voltar
   </button>

  </div>

  <label>
   Nome da lista

   <input
    id="lname"
    placeholder="Ex.: Câmara Fria - 11/09">
  </label>

  <button class="primary" onclick="createList()">
   Criar lista
  </button>

 </section>

 `;

}

function createList(){

 const name=document
  .getElementById("lname")
  ?.value
  .trim();

 if(!name){

  alert("Digite o nome da lista.");
  return;

 }

 current={
  id:Date.now(),
  name:name,
  created:new Date().toLocaleDateString("pt-BR"),
  products:[]
 };

 currentPhoto="";

 editor();

}

/* =====================================================
   EDITOR
===================================================== */

function editor(){

 stopCam();

 if(!current){

  home();
  return;

 }

 currentPhoto="";

 app().innerHTML=`

 <section class="card">

  <div class="top">

   <div>

    <h2>${esc(current.name)}</h2>

    <span class="badge">
     ${current.products.length} produto(s)
    </span>

   </div>

   <button class="back" onclick="home()">
    ← Início
   </button>

  </div>

  <hr>

  <div class="step">
   ETAPA 1 — ESCANEAR CÓDIGO DE BARRAS
  </div>

  <div class="camera">

   <div id="cammsg" class="camera-title">
    Abrindo câmera...
   </div>

   <div class="video-wrap">

    <video
     id="video"
     autoplay
     playsinline
     muted>
    </video>

    <div id="scanarea" class="scan-area">

     <span>
      Posicione o código de barras aqui
     </span>

    </div>

    <div id="scanline" class="scanline"></div>

    <div id="photoframe" class="photo-frame hidden">

     <span>
      Enquadre o produto aqui
     </span>

    </div>

   </div>

  </div>

  <div id="scanstatus" class="status">
   📷 Preparando câmera...
  </div>

  <label>

   Código de barras

   <input
    id="pbar"
    inputmode="numeric"
    pattern="[0-9]*"
    placeholder="Código preenchido automaticamente">

  </label>

  <div id="photoSection" class="hidden">

   <div class="step">
    ETAPA 2 — FOTO DO PRODUTO
   </div>

   <button
    id="photoButton"
    class="primary"
    onclick="tirarFoto()">

    📸 Tirar foto do produto

   </button>

   <img
    id="photoPreview"
    class="photo-preview hidden"
    alt="Foto do produto">

  </div>

  <div id="dataSection" class="hidden">

   <div class="step">
    ETAPA 3 — VALIDADE E QUANTIDADE
   </div>

   <div class="row">

    <label>

     Validade

     <input id="pexp" type="date">

    </label>

    <label>

     Quantidade

     <input
      id="pqty"
      type="number"
      min="1"
      value="1">

    </label>

   </div>

   <label>

    Setor

    <input
     id="psector"
     placeholder="Ex.: Câmara Fria">

   </label>

   <button class="green" onclick="addProduct()">
    💾 Salvar produto
   </button>

  </div>

  <div style="margin-top:18px">

   <h3>
    Produtos desta lista
   </h3>

   <div id="products"></div>

  </div>

  <button
   class="primary"
   style="margin-top:15px"
   onclick="finishList()">

   ✅ Finalizar lista

  </button>

 </section>

 `;

 renderProducts();

 setTimeout(function(){
  iniciarLeituraCodigo();
 },400);

}

/* =====================================================
   PRODUTOS
===================================================== */

function renderProducts(){

 const el=document.getElementById("products");

 if(!el || !current)return;

 if(!current.products.length){

  el.innerHTML=
   '<p class="muted">Nenhum produto cadastrado ainda.</p>';

  return;

 }

 el.innerHTML=current.products.map(function(p,i){

  return `

   <div class="product">

    <div class="code-number">
     ${i+1}. ${esc(p.bar)}
    </div>

    ${
     p.photo
     ?
     `<img
       src="${p.photo}"
       class="report-photo"
       alt="Produto">`
     :
     ""
    }

    <div>
     <b>Validade:</b>
     ${esc(formatDate(p.exp))}
    </div>

    <div>
     <b>Quantidade:</b>
     ${esc(p.qty)}
    </div>

    ${
     p.sector
     ?
     `<div class="muted">
       Setor: ${esc(p.sector)}
      </div>`
     :
     ""
    }

   </div>

  `;

 }).join("");

}

/* =====================================================
   CÓDIGO DE BARRAS
===================================================== */

async function iniciarLeituraCodigo(){

 cameraMode="barcode";

 const video=document.getElementById("video");
 const status=document.getElementById("scanstatus");
 const msg=document.getElementById("cammsg");

 if(!video)return;

 try{

  stopCam();

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

   throw new Error("Câmera indisponível");

  }

  if(msg)
   msg.textContent=
   "Aponte para o código de barras.";

  if(status)
   status.textContent=
   "🔎 Procurando código...";

  stream=await navigator.mediaDevices.getUserMedia({

   audio:false,

   video:{
    facingMode:{ideal:"environment"},
    width:{ideal:1280},
    height:{ideal:720},
    frameRate:{ideal:30,max:60}
   }

  });

  video.srcObject=stream;

  await video.play();

  if(!("BarcodeDetector" in window)){

   if(status)
    status.textContent=
    "⚠️ Leitura automática indisponível. Digite o código.";

   return;

  }

  let detector;

  try{

   const formats=
    await BarcodeDetector.getSupportedFormats();

   const preferidos=[
    "ean_13",
    "ean_8",
    "upc_a",
    "upc_e",
    "code_128",
    "itf"
   ];

   const validos=
    preferidos.filter(function(f){
     return formats.includes(f);
    });

   detector=new BarcodeDetector({
    formats:validos.length?validos:formats
   });

  }catch(e){

   detector=new BarcodeDetector();

  }

  let busy=false;

  scanTimer=setInterval(async function(){

   if(cameraMode!=="barcode")return;

   if(busy)return;

   if(!video.videoWidth)return;

   busy=true;

   try{

    const codes=await detector.detect(video);

    if(codes && codes.length){

     let codigo=String(
      codes[0].rawValue||""
     ).replace(/\D/g,"");

     if(codigo){

      const input=
       document.getElementById("pbar");

      if(input)
       input.value=codigo;

      clearInterval(scanTimer);
      scanTimer=null;

      if(status)
       status.textContent=
       "✅ Código lido: "+codigo;

      if(msg)
       msg.textContent=
       "Código lido. Abrindo câmera para foto...";

      setTimeout(function(){

       iniciarCameraFoto();

      },400);

     }

    }

   }catch(e){

    console.log("Scanner:",e);

   }finally{

    busy=false;

   }

  },120);

 }catch(e){

  console.log("Câmera:",e);

  if(status)
   status.textContent=
   "⚠️ Não foi possível abrir a câmera. Verifique a permissão.";

 }

}

/* =====================================================
   CÂMERA DE FOTO
===================================================== */

async function iniciarCameraFoto(){

 cameraMode="photo";

 if(scanTimer){

  clearInterval(scanTimer);
  scanTimer=null;

 }

 stopCameraTracksOnly();

 const video=document.getElementById("video");
 const status=document.getElementById("scanstatus");
 const msg=document.getElementById("cammsg");

 const scanarea=document.getElementById("scanarea");
 const scanline=document.getElementById("scanline");
 const photoframe=document.getElementById("photoframe");
 const photoSection=document.getElementById("photoSection");

 if(!video)return;

 if(scanarea)
  scanarea.classList.add("hidden");

 if(scanline)
  scanline.classList.add("hidden");

 if(photoframe)
  photoframe.classList.remove("hidden");

 if(photoSection)
  photoSection.classList.remove("hidden");

 if(msg)
  msg.textContent=
  "Agora enquadre o produto e tire a foto.";

 if(status)
  status.textContent=
  "📸 Câmera pronta para fotografar.";

 try{

  stream=await navigator.mediaDevices.getUserMedia({

   audio:false,

   video:{
    facingMode:{ideal:"environment"},
    width:{ideal:1920},
    height:{ideal:1080}
   }

  });

  video.srcObject=stream;

  await video.play();

 }catch(e){

  console.log("Foto:",e);

  if(status)
   status.textContent=
   "⚠️ Não foi possível abrir a câmera para a foto.";

 }

}

/* =====================================================
   TIRAR FOTO
===================================================== */

function tirarFoto(){

 if(cameraMode!=="photo"){

  iniciarCameraFoto();
  return;

 }

 const video=document.getElementById("video");

 if(!video || !video.videoWidth){

  alert("A câmera ainda não está pronta.");
  return;

 }

 const ratio=60/25;

 const vw=video.videoWidth;
 const vh=video.videoHeight;

 let cropWidth=vw;
 let cropHeight=Math.round(vw/ratio);

 if(cropHeight>vh){

  cropHeight=vh;
  cropWidth=Math.round(vh*ratio);

 }

 const sx=Math.round((vw-cropWidth)/2);
 const sy=Math.round((vh-cropHeight)/2);

 const canvas=document.createElement("canvas");

 canvas.width=1200;
 canvas.height=500;

 const ctx=canvas.getContext("2d");

 ctx.drawImage(
  video,
  sx,
  sy,
  cropWidth,
  cropHeight,
  0,
  0,
  1200,
  500
 );

 currentPhoto=canvas.toDataURL(
  "image/jpeg",
  .82
 );

 const preview=
  document.getElementById("photoPreview");

 if(preview){

  preview.src=currentPhoto;

  preview.classList.remove("hidden");

 }

 stopCam();

 const status=
  document.getElementById("scanstatus");

 const msg=
  document.getElementById("cammsg");

 const data=
  document.getElementById("dataSection");

 if(status)
  status.textContent=
  "✅ Foto capturada.";

 if(msg)
  msg.textContent=
  "Foto pronta. Informe validade e quantidade.";

 if(data)
  data.classList.remove("hidden");

}

/* =====================================================
   PARAR CÂMERA
===================================================== */

function stopCameraTracksOnly(){

 if(stream){

  stream.getTracks().forEach(function(track){
   track.stop();
  });

  stream=null;

 }

}

function stopCam(){

 if(scanTimer){

  clearInterval(scanTimer);
  scanTimer=null;

 }

 stopCameraTracksOnly();

}

/* =====================================================
   ADICIONAR PRODUTO
===================================================== */

function addProduct(){

 if(!current)return;

 const bar=String(
  document.getElementById("pbar")?.value||""
 ).replace(/\D/g,"");

 const exp=
  document.getElementById("pexp")?.value||"";

 const qty=Number(
  document.getElementById("pqty")?.value||0
 );

 const sector=String(
  document.getElementById("psector")?.value||""
 ).trim();

 if(!bar){

  alert("Leia o código de barras.");
  return;

 }

 if(!currentPhoto){

  alert("Tire a foto do produto.");
  return;

 }

 if(!exp){

  alert("Informe a validade.");
  return;

 }

 if(qty<1){

  alert("Informe uma quantidade válida.");
  return;

 }

 current.products.push({

  bar:bar,
  photo:currentPhoto,
  exp:exp,
  qty:qty,
  sector:sector

 });

 save();

 currentPhoto="";

 editor();

}

/* =====================================================
   FINALIZAR LISTA
===================================================== */

function finishList(){

 stopCam();

 if(!current || !current.products.length){

  alert("Cadastre pelo menos um produto.");
  return;

 }

 const index=db.lists.findIndex(function(item){
  return item.id===current.id;
 });

 if(index<0)
  db.lists.push(current);
 else
  db.lists[index]=current;

 save();

 alert("Lista salva no aparelho!");

 current=null;
 currentPhoto="";

 home();

}

/* =====================================================
   LISTAS
===================================================== */

function lists(){

 stopCam();

 app().innerHTML=`

 <section class="card">

  <div class="top">

   <h2>Minhas listas</h2>

   <button class="back" onclick="home()">
    ← Início
   </button>

  </div>

  ${
   db.lists.length
   ?
   db.lists.map(function(l){

    return `

      <b>${esc(l.name)}</b>

      <span class="muted">

      </span>

      <br>

      <button

    `;

function openList(id){

 current=db.lists.find(function(item){
  return item.id===id;
 })||null;

 if(current)
  editor();

}

/* =====================================================
   RELATÓRIO
===================================================== */

function reports(){

 app().innerHTML=`

 <section class="card">

  <div class="top">

   <h2>Relatório final</h2>

   <button class="back" onclick="home()">

   </button>

  </div>

/* =====================================================
   PDF
===================================================== */

function getPDFConstructor(){

 if(
  window.jspdf &&
  typeof window.jspdf.jsPDF==="function"
 ){

  return window.jspdf.jsPDF;

 }

 return null;

}

function createPDF(id){

 const l=db.lists.find(function(item){
  return item.id===id;
 });

 if(!l)
  throw new Error("Lista não encontrada.");

 const jsPDF=getPDFConstructor();

 if(!jsPDF)
  throw new Error("Gerador PDF ainda não carregou.");

 const doc=new jsPDF({
  orientation:"portrait",
  unit:"mm",
  format:"a4"
 });

 doc.setFont("helvetica","bold");
 doc.setFontSize(20);

 doc.text("VALIDADE-",14,18);

 doc.setFont("helvetica","normal");
 doc.setFontSize(13);

 doc.text(
  String(l.name).slice(0,55),
  14,
  27
 );

 doc.setFontSize(9);

 doc.text(
  "Relatório de vencimentos",
  14,
  34
 );

 doc.text(
  "Data: "+String(l.created),
  145,
  34
 );

 let y=44;

 l.products.forEach(function(p,index){

  if(y+50>285){

   doc.addPage();
   y=20;

  }

  doc.setFont("helvetica","bold");
  doc.setFontSize(10);

  doc.text(
   (index+1)+". Código: "+String(p.bar),
   14,
   y
  );

  doc.setFont("helvetica","normal");

  y+=5;

  if(p.photo){

   try{

    doc.addImage(
     p.photo,
     "JPEG",
     14,
     y,
     60,
     25
    );

   }catch(e){

    console.error("Foto PDF:",e);

   }

  }

  const x=82;

  doc.setFontSize(9);

  doc.text("Validade:",x,y+6);

  doc.text(
   formatDate(p.exp),
   x+23,
   y+6
  );

  doc.text("Quantidade:",x,y+13);

  doc.text(
   String(p.qty),
   x+25,
   y+13
  );

  if(p.sector){

   doc.text("Setor:",x,y+20);

   doc.text(
    String(p.sector).slice(0,35),
    x+15,
    y+20
   );

  }

  y+=33;

  doc.line(
   14,
   y,
   196,
   y
  );

  y+=8;

 });

 if(y+10>285){

  doc.addPage();
  y=20;

 }

 doc.setFontSize(9);

 doc.text(
  "Total de produtos: "+l.products.length,
  14,
  y
 );

 return doc;

}

/* =====================================================
   NOME DO PDF
===================================================== */

function pdfFileName(l){

 const nome=String(l.name)
 .replace(/[^a-z0-9À-ÿ]+/gi,"-")
 .replace(/^-+|-+$/g,"");

 return "Validade-"+(nome||"Lista")+".pdf";

}

/* =====================================================
   GERAR PDF
===================================================== */

function generatePDF(id){

 try{

  const l=db.lists.find(function(item){
   return item.id===id;
  });

  if(!l){

   alert("Lista não encontrada.");
   return;

  }

  const doc=createPDF(id);

  const blob=doc.output("blob");

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=pdfFileName(l);

  a.style.display="none";

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  const status=
   document.getElementById("pdfStatus-"+id);

  if(status)
   status.textContent=
   "✅ PDF gerado: "+pdfFileName(l);

  setTimeout(function(){

   URL.revokeObjectURL(url);

  },5000);

 }catch(e){

  console.error("Erro PDF:",e);

  alert(
   "Não foi possível gerar o PDF. Aguarde o carregamento do gerador e tente novamente."
  );

 }

}

/* =====================================================
   COMPARTILHAR PDF
===================================================== */

async function sharePDFWhatsApp(id){

 try{

  const l=db.lists.find(function(item){
   return item.id===id;
  });

  if(!l){

   alert("Lista não encontrada.");
   return;

  }

  const doc=createPDF(id);

  const blob=doc.output("blob");

  const file=new File(
   [blob],
   pdfFileName(l),
   {
    type:"application/pdf"
   }
  );

  if(
   navigator.share &&
   navigator.canShare &&
   navigator.canShare({
    files:[file]
   })
  ){

   await navigator.share({

    title:"Validade- - "+l.name,

    text:"Relatório de validade - "+l.name,

    files:[file]

   });

   return;

  }

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=pdfFileName(l);

  a.style.display="none";

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  setTimeout(function(){

   URL.revokeObjectURL(url);

  },5000);

  alert(
   "O PDF foi salvo. Abra o WhatsApp e anexe o arquivo."
  );

 }catch(e){

  if(
   e &&
   e.name==="AbortError"
  ){

   return;

  }

  console.error(
   "Erro ao compartilhar PDF:",
   e
  );

  alert(
   "Não foi possível compartilhar o PDF."
  );

}
