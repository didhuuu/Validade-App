}

body{

<body>

<header>

<h1>Validade-</h1>

<p>
Controle de vencimentos
</p>

</header>

<main id="app">

<section class="card">

<h2>Carregando...</h2>

<p class="muted">
Inicializando aplicativo.
</p>

</section>

</main>


<script>

/* =====================================================
   BANCO
===================================================== */

const KEY = "validade_app_v4";

let db = {
  lists:[]
};

let current = null;

let stream = null;

let scanTimer = null;

let cameraMode = "barcode";

let currentPhoto = "";


/* =====================================================
   CARREGAR
===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(KEY);

    if(saved){

      const parsed =
        JSON.parse(saved);

      if(
        parsed &&
        Array.isArray(parsed.lists)
      ){

        db = parsed;

      }

    }

  }catch(error){

    console.log(error);

    db = {
      lists:[]
    };

  }

}


/* =====================================================
   SALVAR
===================================================== */

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(db)
    );

  }catch(error){

    console.log(error);

    alert(
      "Não foi possível salvar. O armazenamento do aparelho está cheio."
    );

  }

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m];

    });

}


/* =====================================================
   APP
===================================================== */

function app(){

  return document.getElementById("app");

}


/* =====================================================
   INÍCIO
===================================================== */

function home(){

  stopCam();

  current = null;

  currentPhoto = "";

  app().innerHTML = `

<section class="card">

<h2>Início</h2>

<p class="muted">
Controle seus produtos e datas de validade.
</p>

<div class="actions">

<button
class="primary"
onclick="newList()">

➕ Criar nova lista

</button>

<button
class="light"
onclick="lists()">

📋 Minhas listas

</button>

<button
class="light"
onclick="reports()">

📄 Relatório final

</button>

<button
class="danger"
onclick="clearData()">

🗑 Limpar dados

</button>

</div>

</section>

<section class="card">

<b>Como funciona</b>

<p class="muted">

A câmera abre para ler o código.
Depois muda automaticamente para
fotografar o produto.

</p>

</section>

`;

}


/* =====================================================
   NOVA LISTA
===================================================== */

function newList(){

  app().innerHTML = `

<section class="card">

<div class="top">

<h2>Nova lista</h2>

<button
class="back"
onclick="home()">

← Voltar

</button>

</div>

<label>

Nome da lista

<input
id="lname"
placeholder="Ex.: Câmara Fria – 11/09">

</label>

<button
class="primary"
onclick="createList()">

Criar lista

</button>

</section>

`;

}


/* =====================================================
   CRIAR LISTA
===================================================== */

function createList(){

  const input =
    document.getElementById("lname");

  const name =
    input?.value.trim();

  if(!name){

    alert(
      "Digite o nome da lista."
    );

    return;

  }

  current = {

    id:Date.now(),

    name:name,

    created:new Date()
      .toLocaleDateString("pt-BR"),

    products:[]

  };

  currentPhoto = "";

  editor();

}


/* =====================================================
   EDITOR
===================================================== */

function editor(){

  stopCam();

  if(!current){

    home();

    return;

  }

  currentPhoto = "";

  app().innerHTML = `

<section class="card">

<div class="top">

<div>

<h2>
${esc(current.name)}
</h2>

<span class="badge">

${current.products.length}
produto(s)

</span>

</div>

<button
class="back"
onclick="home()">

← Início

</button>

</div>

<hr>


<div class="step">

ETAPA 1 — ESCANEANDO CÓDIGO

</div>


<div class="camera">

<div
id="cammsg"
class="camera-title">

Abrindo câmera...

</div>

<div class="video-wrap">

<video
id="video"
autoplay
playsinline
muted>
</video>

<div
id="scanarea"
class="scan-area">

<span>
Posicione o código de barras aqui
</span>

</div>

<div
id="scanline"
class="scanline">
</div>

<div
id="photoframe"
class="photo-frame hidden">

<span>
Enquadre o produto aqui
</span>

</div>

</div>

</div>


<div
id="scanstatus"
class="status">

📷 Preparando câmera...

</div>


<label>

Código de barras

<input
id="pbar"
inputmode="numeric"
pattern="[0-9]*"
placeholder="O código será preenchido automaticamente">

</label>


<div
id="photoSection"
class="hidden">

<div class="step">

ETAPA 2 — FOTO DO PRODUTO

</div>

<button
id="photoButton"
class="primary"
onclick="tirarFoto()">

📸 Tirar foto do produto

</button>

<img
id="photoPreview"
class="photo-preview hidden"
alt="Foto do produto">

</div>


<div
id="dataSection"
class="hidden">

<div class="step">

ETAPA 3 — VALIDADE E QUANTIDADE

</div>

<div class="row">

<label>

Validade

<input
id="pexp"
type="date">

</label>

<label>

Quantidade

<input
id="pqty"
type="number"
min="1"
value="1">

</label>

</div>


<label>

Setor

<input
id="psector"
placeholder="Ex.: Câmara Fria">

</label>


<button
class="green"
onclick="addProduct()">

💾 Salvar produto

</button>

</div>


<div style="margin-top:18px">

<h3>
Produtos desta lista
</h3>

<div id="products"></div>

</div>


<button
class="primary"
style="margin-top:15px"
onclick="finishList()">

✅ Finalizar lista

</button>

</section>

`;

  renderProducts();

  setTimeout(
    iniciarLeituraCodigo,
    200
  );

}


/* =====================================================
   PRODUTOS
===================================================== */

function renderProducts(){

  const el =
    document.getElementById("products");

  if(!el || !current)
    return;

  if(!current.products.length){

    el.innerHTML =
      '<p class="muted">Nenhum produto cadastrado ainda.</p>';

    return;

  }

  el.innerHTML =
    current.products
      .map(function(p,i){

        return `

<div class="product">

<div class="code-number">

${i+1}.
${esc(p.bar)}

</div>

${
p.photo
?
`
<img
src="${p.photo}"
class="report-photo"
alt="Produto">
`
:
""
}

<div>

<b>Validade:</b>
${esc(formatDate(p.exp))}

</div>

<div>

<b>Quantidade:</b>
${esc(p.qty)}

</div>

${
p.sector
?
`
<div class="muted">

Setor:
${esc(p.sector)}

</div>
`
:
""
}

</div>

`;

      })
      .join("");

}


/* =====================================================
   DATA
===================================================== */

function formatDate(value){

  if(!value)
    return "";

  const p =
    String(value).split("-");

  if(p.length !== 3)
    return value;

  return (
    p[2] +
    "/" +
    p[1] +
    "/" +
    p[0]
  );

}


/* =====================================================
   CÂMERA — CÓDIGO
===================================================== */

async function iniciarLeituraCodigo(){

  cameraMode = "barcode";

  const video =
    document.getElementById("video");

  const status =
    document.getElementById("scanstatus");

  const msg =
    document.getElementById("cammsg");

  if(!video)
    return;

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Câmera indisponível"
      );

    }

    stopCam();

    if(msg){

      msg.textContent =
        "Aponte para o código de barras.";

    }

    if(status){

      status.textContent =
        "🔎 Procurando código...";

    }

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        audio:false,

        video:{
          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          },

          frameRate:{
            ideal:30,
            max:60
          }

        }

      });

    video.srcObject =
      stream;

    await video.play();


    if(
      !("BarcodeDetector" in window)
    ){

      if(status){

        status.textContent =
          "⚠️ Leitura automática não disponível. Digite o código.";

      }

      return;

    }


    let formats = [];

    try{

      formats =
        await BarcodeDetector
        .getSupportedFormats();

    }catch(e){

      formats = [];

    }


    let detector;

    try{

      detector =
        formats.length
        ?
        new BarcodeDetector({
          formats:formats
        })
        :
        new BarcodeDetector();

    }catch(e){

      detector =
        new BarcodeDetector();

    }


    /*
      LEITURA RÁPIDA
    */

    scanTimer =
      setInterval(
        async function(){

          if(
            cameraMode !== "barcode"
          ){

            return;

          }

          if(
            !video.videoWidth ||
            !video.videoHeight
          ){

            return;

          }

          try{

            const codes =
              await detector.detect(video);

            if(
              codes &&
              codes.length
            ){

              let codigo =
                codes[0].rawValue || "";

              codigo =
                String(codigo)
                .replace(
                  /\D/g,
                  ""
                );


              if(!codigo)
                return;


              const input =
                document.getElementById("pbar");

              if(input){

                input.value =
                  codigo;

              }


              clearInterval(
                scanTimer
              );

              scanTimer = null;


              if(status){

                status.textContent =
                  "✅ Código lido: " +
                  codigo;

              }


              if(msg){

                msg.textContent =
                  "Código lido. Abrindo câmera para foto...";

              }


              setTimeout(
                iniciarCameraFoto,
                350
              );

            }

          }catch(error){

            console.log(
              "Leitura:",
              error
            );

          }

        },
        100
      );

  }catch(error){

    console.log(
      "Câmera:",
      error
    );

    if(status){

      status.textContent =
        "⚠️ Não foi possível abrir a câmera. Verifique a permissão.";

    }

  }

}


/* =====================================================
   CÂMERA — FOTO
===================================================== */

async function iniciarCameraFoto(){

  cameraMode = "photo";

  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer = null;

  }

  stopCameraTracksOnly();


  const video =
    document.getElementById("video");

  const status =
    document.getElementById("scanstatus");

  const msg =
    document.getElementById("cammsg");

  const scanArea =
    document.getElementById("scanarea");

  const scanLine =
    document.getElementById("scanline");

  const photoFrame =
    document.getElementById("photoframe");

  const photoSection =
    document.getElementById("photoSection");


  if(!video)
    return;


  if(scanArea)
    scanArea.classList.add("hidden");

  if(scanLine)
    scanLine.classList.add("hidden");

  if(photoFrame)
    photoFrame.classList.remove("hidden");

  if(photoSection)
    photoSection.classList.remove("hidden");


  if(msg){

    msg.textContent =
      "Agora enquadre o produto e tire a foto.";

  }


  if(status){

    status.textContent =
      "📸 Câmera pronta para fotografar.";

  }


  try{

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        audio:false,

        video:{
          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }

        }

      });

    video.srcObject =
      stream;

    await video.play();

  }catch(error){

    console.log(error);

    if(status){

      status.textContent =
        "⚠️ Não foi possível abrir a câmera para a foto.";

    }

  }

}


/* =====================================================
   TIRAR FOTO
===================================================== */

function tirarFoto(){

  if(
    cameraMode !== "photo"
  ){

    iniciarCameraFoto();

    return;

  }


  const video =
    document.getElementById("video");

  if(
    !video ||
    !video.videoWidth
  ){

    alert(
      "A câmera ainda não está pronta."
    );

    return;

  }


  /*
    60 x 25 = 2.4 : 1
  */

  const ratio =
    60 / 25;


  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;


  let cropWidth =
    vw;

  let cropHeight =
    Math.round(
      vw / ratio
    );


  if(cropHeight > vh){

    cropHeight =
      vh;

    cropWidth =
      Math.round(
        vh * ratio
      );

  }


  const sx =
    Math.round(
      (vw - cropWidth) / 2
    );


  const sy =
    Math.round(
      (vh - cropHeight) / 2
    );


  const canvas =
    document.createElement("canvas");


  canvas.width = 1200;

  canvas.height = 500;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    sx,
    sy,
    cropWidth,
    cropHeight,
    0,
    0,
    1200,
    500
  );


  currentPhoto =
    canvas.toDataURL(
      "image/jpeg",
      0.82
    );


  const preview =
    document.getElementById("photoPreview");


  if(preview){

    preview.src =
      currentPhoto;

    preview.classList.remove(
      "hidden"
    );

  }


  stopCam();


  const status =
    document.getElementById("scanstatus");

  const msg =
    document.getElementById("cammsg");


  if(status){

    status.textContent =
      "✅ Foto capturada.";

  }


  if(msg){

    msg.textContent =
      "Foto pronta. Informe validade e quantidade.";

  }


  const dataSection =
    document.getElementById("dataSection");


  if(dataSection){

    dataSection.classList.remove(
      "hidden"
    );

  }

}


/* =====================================================
   PARAR TRACKS
===================================================== */

function stopCameraTracksOnly(){

  if(stream){

    stream
      .getTracks()
      .forEach(function(track){

        track.stop();

      });

    stream = null;

  }

}


/* =====================================================
   PARAR CÂMERA
===================================================== */

function stopCam(){

  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer = null;

  }

  stopCameraTracksOnly();

}


/* =====================================================
   ADICIONAR PRODUTO
===================================================== */

function addProduct(){

  if(!current)
    return;


  const bar =
    String(
      document.getElementById("pbar")?.value || ""
    )
    .replace(
      /\D/g,
      ""
    );


  const exp =
    document.getElementById("pexp")?.value || "";


  const qty =
    Number(
      document.getElementById("pqty")?.value || 0
    );


  const sector =
    String(
      document.getElementById("psector")?.value || ""
    ).trim();


  if(!bar){

    alert(
      "Leia o código de barras."
    );

    return;

  }


  if(!currentPhoto){

    alert(
      "Tire a foto do produto."
    );

    return;

  }


  if(!exp){

    alert(
      "Informe a validade."
    );

    return;

  }


  if(qty < 1){

    alert(
      "Informe uma quantidade válida."
    );

    return;

  }


  current.products.push({

    bar:bar,

    photo:currentPhoto,

    exp:exp,

    qty:qty,

    sector:sector

  });


  save();

  currentPhoto = "";

  editor();

}


/* =====================================================
   FINALIZAR LISTA
===================================================== */

function finishList(){

  stopCam();

  if(
    !current ||
    !current.products.length
  ){

    alert(
      "Cadastre pelo menos um produto."
    );

    return;

  }


  const index =
    db.lists.findIndex(
      function(item){

        return item.id === current.id;

      }
    );


  if(index < 0){

    db.lists.push(current);

  }else{

    db.lists[index] =
      current;

  }


  save();

  alert(
    "Lista salva no aparelho!"
  );

  current = null;

  currentPhoto = "";

  home();

}

return `

/* =====================================================
   CRIAR PDF
===================================================== */

function createPDFBlob(id){

  const l =
    db.lists.find(
      function(item){

        return item.id === id;

      }
    );


  if(!l)
    return null;


  if(
    !window.jspdf ||
    !window.jspdf.jsPDF
  ){

    return null;

  }


  const jsPDF =
    window.jspdf.jsPDF;


  const doc =
    new jsPDF({

      orientation:"portrait",

      unit:"mm",

      format:"a4"

    });


  doc.setFontSize(20);

  doc.text(
    "VALIDADE-",
    14,
    18
  );


  doc.setFontSize(13);

  doc.text(
    String(l.name).slice(0,50),
    14,
    27
  );


  doc.setFontSize(9);

  doc.text(
    "Relatório de vencimentos",
    14,
    34
  );


  doc.text(
    "Data: " + l.created,
    150,
    34
  );


  let y = 44;


  l.products.forEach(
    function(p,index){

      const blockHeight =
        48;


      if(
        y + blockHeight > 285
      ){

        doc.addPage();

        y = 20;

      }


      doc.setFontSize(10);

      doc.text(
        String(index + 1) +
        ". Código: " +
        String(p.bar),
        14,
        y
      );


      y += 5;


      if(p.photo){

        try{

          doc.addImage(
            p.photo,
            "JPEG",
            14,
            y,
            60,
            25
          );

        }catch(error){

          console.log(
            "Erro foto PDF:",
            error
          );

        }

      }


      const x = 82;


      doc.setFontSize(9);

      doc.text(
        "Validade:",
        x,
        y + 6
      );

      doc.text(
        String(formatDate(p.exp)),
        x + 23,
        y + 6
      );


      doc.text(
        "Quantidade:",
        x,
        y + 13
      );

      doc.text(
        String(p.qty),
        x + 25,
        y + 13
      );


      if(p.sector){

        doc.text(
          "Setor:",
          x,
          y + 20
        );

        doc.text(
          String(p.sector).slice(0,35),
          x + 15,
          y + 20
        );

      }


      y += 33;


      doc.line(
        14,
        y,
        196,
        y
      );


      y += 8;

    }
  );


  if(y > 285){

    doc.addPage();

    y = 20;

  }


  doc.setFontSize(9);

  doc.text(
    "Total de produtos: " +
    l.products.length,
    14,
    y
  );


  return doc.output("blob");

}


/* =====================================================
   NOME DO PDF
===================================================== */

function pdfFileName(l){

  const nome =
    String(l.name)
      .replace(
        /[^a-z0-9À-ÿ]+/gi,
        "-"
      )
      .replace(
        /^-+|-+$/g,
        ""
      );


  return (
    "Validade-" +
    (nome || "Lista") +
    ".pdf"
  );

}


/* =====================================================
   GERAR PDF
===================================================== */

function generatePDF(id){

  try{

    const l =
      db.lists.find(
        function(item){

          return item.id === id;

        }
      );


    if(!l){

      alert(
        "Lista não encontrada."
      );

      return;

    }


    const blob =
      createPDFBlob(id);


    if(!blob){

      alert(
        "Não foi possível gerar o PDF. Aguarde o carregamento do gerador e tente novamente."
      );

      return;

    }


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");


    a.href =
      url;

    a.download =
      pdfFileName(l);

    a.style.display =
      "none";

    a.rel =
      "noopener";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    setTimeout(
      function(){

        URL.revokeObjectURL(url);

      },
      10000
    );


  }catch(error){

    console.log(
      "Erro PDF:",
      error
    );

    alert(
      "Erro ao gerar o PDF: " +
      error.message
    );

  }

}


/* =====================================================
   COMPARTILHAR PDF
===================================================== */

async function sharePDFWhatsApp(id){

  try{

    const l =
      db.lists.find(
        function(item){

          return item.id === id;

        }
      );


    if(!l){

      alert(
        "Lista não encontrada."
      );

      return;

    }


    const blob =
      createPDFBlob(id);


    if(!blob){

      alert(
        "Não foi possível gerar o PDF."
      );

      return;

    }


    const filename =
      pdfFileName(l);


    const file =
      new File(
        [blob],
        filename,
        {
          type:"application/pdf",
          lastModified:Date.now()
        }
      );


    /*
      PRIMEIRA OPÇÃO:
      COMPARTILHAMENTO NATIVO
      DO ANDROID.

      O usuário escolhe WhatsApp
      e o PDF vai como arquivo.
    */

    if(
      navigator.share
    ){

      let supported = true;


      if(
        navigator.canShare
      ){

        try{

          supported =
            navigator.canShare({
              files:[file]
            });

        }catch(error){

          supported = false;

        }

      }


      if(supported){

        try{

          await navigator.share({

            title:
              "Validade- — " +
              l.name,

            text:
              "Relatório de validade — " +
              l.name,

            files:[
              file
            ]

          });

          return;

        }catch(error){

          if(
            error &&
            error.name === "AbortError"
          ){

            return;

          }

          console.log(
            "Compartilhamento cancelado/indisponível:",
            error
          );

        }

      }

    }


    /*
      SEGUNDA OPÇÃO:
      SALVA O PDF.
    */

    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");


    a.href =
      url;

    a.download =
      filename;

    a.style.display =
      "none";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    setTimeout(
      function(){

        URL.revokeObjectURL(url);

      },
      10000
    );


    /*
      ABRE WHATSAPP.
    */

    const texto =
      "Relatório de validade — " +
      l.name +
      "\n\n" +
      "O PDF foi salvo no aparelho. " +
      "Anexe o arquivo " +
      filename +
      " nesta conversa.";


    const whatsapp =
      "https://wa.me/?text=" +
      encodeURIComponent(texto);


    setTimeout(
      function(){

        window.location.href =
          whatsapp;

      },
      1000
    );


  }catch(error){

    console.log(
      "Erro compartilhamento:",
      error
    );


    try{

      generatePDF(id);

    }catch(e){

      console.log(e);

    }


    alert(
      "O PDF foi gerado. O compartilhamento direto não está disponível neste ambiente."
    );

  }

}
