<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Validade-</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#071d49,#1265d8);
  color:white;
  padding:24px 18px 20px;
  border-radius:0 0 24px 24px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:5px 0 0;
  opacity:.85;
}

main{
  max-width:620px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 5px 18px #102a4d14;
}

button{
  border:0;
  border-radius:13px;
  padding:14px 16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#1265d8;
  color:white;
  width:100%;
}

.green{
  background:#16a36b;
  color:white;
  width:100%;
}

.whatsapp{
  background:#128c4a;
  color:white;
  width:100%;
}

.light{
  background:#eaf1fb;
  color:#17457f;
}

.danger{
  background:#feecec;
  color:#b42318;
  width:100%;
}

.actions{
  display:grid;
  gap:12px;
}

.muted{
  color:#68758a;
  font-size:14px;
}

.hidden{
  display:none!important;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccd6e4;
  border-radius:11px;
  font-size:16px;
  margin-top:7px;
}

label{
  display:block;
  margin:13px 0;
  font-weight:700;
  font-size:14px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.back{
  background:transparent;
  color:#1265d8;
  padding:5px 0;
}

.listbox{
  border:1px solid #dce4ef;
  border-radius:13px;
  padding:13px;
  margin:10px 0;
}

.product{
  border:1px solid #dce4ef;
  padding:12px;
  background:#f7f9fc;
  border-radius:12px;
  margin-top:10px;
}

.badge{
  display:inline-block;
  background:#e8f4ff;
  color:#1265d8;
  border-radius:20px;
  padding:5px 9px;
  font-size:12px;
}

.camera{
  background:#101722;
  border-radius:16px;
  padding:14px;
  color:white;
  text-align:center;
}

.camera-title{
  font-size:15px;
  margin-bottom:10px;
}

.video-wrap{
  position:relative;
}

video{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:11px;
  background:#05080d;
}

.scan-area{
  position:absolute;
  left:8%;
  right:8%;
  top:28%;
  height:44%;
  border:2px solid #31d78c;
  border-radius:10px;
  pointer-events:none;
}

.scan-area span{
  position:absolute;
  bottom:-28px;
  left:0;
  right:0;
  font-size:12px;
  color:#31d78c;
}

.scanline{
  height:3px;
  background:#31d78c;
  position:absolute;
  left:10%;
  right:10%;
  top:50%;
  border-radius:5px;
}

.photo-frame{
  position:absolute;
  left:5%;
  right:5%;
  top:35%;
  height:30%;
  border:2px solid #31d78c;
  border-radius:8px;
  pointer-events:none;
}

.photo-frame span{
  position:absolute;
  bottom:-28px;
  left:0;
  right:0;
  font-size:12px;
  color:#31d78c;
}

.status{
  padding:10px;
  border-radius:10px;
  background:#eef7f1;
  color:#17663f;
  font-size:14px;
  margin-top:10px;
}

.photo-preview{
  width:100%;
  aspect-ratio:2.4/1;
  object-fit:cover;
  border-radius:10px;
  margin-top:12px;
  border:1px solid #ccd6e4;
  background:#e9eef5;
}

.report-photo{
  width:180px;
  height:75px;
  object-fit:cover;
  border-radius:6px;
  border:1px solid #ccd6e4;
  display:block;
  margin:10px 0;
}

.step{
  font-size:13px;
  color:#68758a;
  margin:14px 0 6px;
  font-weight:700;
}

.code-number{
  font-size:18px;
  font-weight:700;
  letter-spacing:1px;
}

hr{
  border:0;
  border-top:1px solid #e3e8ef;
  margin:18px 0;
}

.report-actions{
  display:grid;
  gap:8px;
  margin-top:12px;
}

</style>
</head>

<body>

<header>
<h1>
