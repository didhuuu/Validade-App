name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Adicionar suporte nativo para compartilhamento
        run: |
          npm install @capacitor/share@7.0.2 @capacitor/filesystem@7.1.4

      - name: Preparar arquivos web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Criar projeto Android
        run: npx cap add android

      - name: Adicionar permissão da câmera
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.CAMERA" />'

          if permission not in text:
              text = text.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          manifest.write_text(text)
          PY

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Verificar plugins nativos
        run: |
          echo "Plugins Capacitor instalados:"
          npx cap ls

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Validade-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
