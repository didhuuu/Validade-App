<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Validade-</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#071d49,#1265d8);color:#fff;padding:24px 18px 20px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0;opacity:.85}
main{max-width:620px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #102a4d14}
button{border:0;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#1265d8;color:#fff;width:100%}
.green{background:#16a36b;color:#fff;width:100%}
.whatsapp{background:#128c4a;color:#fff;width:100%}
.light{background:#eaf1fb;color:#17457f}
.danger{background:#feecec;color:#b42318;width:100%}
.actions{display:grid;gap:12px}
.muted{color:#68758a;font-size:14px}
.hidden{display:none!important}
input{width:100%;padding:13px;border:1px solid #ccd6e4;border-radius:11px;font-size:16px;margin-top:7px}
label{display:block;margin:13px 0;font-weight:700;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{background:transparent;color:#1265d8;padding:5px 0}
.listbox{border:1px solid #dce4ef;border-radius:13px;padding:13px;margin:10px 0}
.product{border:1px solid #dce4ef;padding:12px;background:#f7f9fc;border-radius:12px;margin-top:10px}
.badge{display:inline-block;background:#e8f4ff;color:#1265d8;border-radius:20px;padding:5px 9px;font-size:12px}
.camera{background:#101722;border-radius:16px;padding:14px;color:#fff;text-align:center}
.camera-title{font-size:15px;margin-bottom:10px}
.video-wrap{position:relative}
video{width:100%;height:300px;object-fit:cover;border-radius:11px;background:#05080d}
.scan-area{position:absolute;left:8%;right:8%;top:28%;height:44%;border:2px solid #31d78c;border-radius:10px;pointer-events:none}
.scan-area span,.photo-frame span{position:absolute;bottom:-28px;left:0;right:0;font-size:12px;color:#31d78c}
.scanline{height:3px;background:#31d78c;position:absolute;left:10%;right:10%;top:50%;border-radius:5px}
.photo-frame{position:absolute;left:5%;right:5%;top:35%;height:30%;border:2px solid #31d78c;border-radius:8px;pointer-events:none}
.status{padding:10px;border-radius:10px;background:#eef7f1;color:#17663f;font-size:14px;margin-top:10px}
.photo-preview{width:100%;aspect-ratio:2.4/1;object-fit:cover;border-radius:10px;margin-top:12px;border:1px solid #ccd6e4;background:#e9eef5}
.report-photo{width:180px;height:75px;object-fit:cover;border-radius:6px;border:1px solid #ccd6e4;display:block;margin:10px 0}
.step{font-size:13px;color:#68758a;margin:14px 0 6px;font-weight:700}
.code-number{font-size:18px;font-weight:700;letter-spacing:1px}
hr{border:0;border-top:1px solid #e3e8ef;margin:18px 0}
.report-actions{display:grid;gap:8px;margin-top:12px}
.pdf-status{font-size:13px;margin-top:8px;color:#68758a}

@media(max-width:480px){
.row{grid-template-columns:1fr}
video{height:270px}
}
</style>
</head>

<body>

<header>
<h1>Validade-</h1>
<p>Controle de vencimentos</p>
</header>

<main id="app"></main>

<script>

var KEY="validade_app_v7";
var db={lists:[]};
var current=null;
var stream=null;
var scanTimer=null;
var cameraMode="barcode";
var currentPhoto="";

function app(){
 return document.getElementById("app");
}

function esc(v){
 return String(v==null?"":v).replace(/[&<>"']/g,function(m){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[m];
 });
}

function formatDate(v){
 if(!v)return"";
 var p=String(v).split("-");
 return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:v;
}

function loadData(){
 try{
  var s=
   localStorage.getItem(KEY)||
   localStorage.getItem("validade_app_v6")||
   localStorage.getItem("validade_app_v5")||
   localStorage.getItem("validade_app_v4");

  if(s){
   var d=JSON.parse(s);
   if(d&&Array.isArray(d.lists))db=d;
  }
 }catch(e){
  console.error(e);
  db={lists:[]};
 }
}

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(db));
 }catch(e){
  alert("Não foi possível salvar os dados.");
 }
}

function home(){

 stopCam();
 current=null;
 currentPhoto="";

 app().innerHTML=
 '<section class="card">'+
 '<h2>Início</h2>'+
 '<p class="muted">Controle seus produtos e datas de validade.</p>'+
 '<div class="actions">'+
 '<button class="primary" onclick="newList()">➕ Criar nova lista</button>'+
 '<button class="light" onclick="lists()">📋 Minhas listas</button>'+
 '<button class="light" onclick="reports()">📄 Relatório final</button>'+
 '<button class="danger" onclick="clearData()">🗑 Limpar dados</button>'+
 '</div>'+
 '</section>'+
 '<section class="card">'+
 '<b>Como funciona</b>'+
 '<p class="muted">A câmera lê o código de barras. Depois abre novamente para fotografar o produto. Informe a validade e a quantidade e salve.</p>'+
 '</section>';
}

function newList(){

 app().innerHTML=
 '<section class="card">'+
 '<div class="top">'+
 '<h2>Nova lista</h2>'+
 '<button class="back" onclick="home()">← Voltar</button>'+
 '</div>'+
 '<label>Nome da lista'+
 '<input id="lname" placeholder="Ex.: Câmara Fria - 11/09">'+
 '</label>'+
 '<button class="primary" onclick="createList()">Criar lista</button>'+
 '</section>';
}

function createList(){

 var x=document.getElementById("lname");
 var name=x?x.value.trim():"";

 if(!name){
  alert("Digite o nome da lista.");
  return;
 }

 current={
  id:Date.now(),
  name:name,
  created:new Date().toLocaleDateString("pt-BR"),
  products:[]
 };

 currentPhoto="";
 editor();
}

function editor(){

 stopCam();

 if(!current){
  home();
  return;
 }

 currentPhoto="";

 app().innerHTML=
 '<section class="card">'+

 '<div class="top">'+
 '<div>'+
 '<h2>'+esc(current.name)+'</h2>'+
 '<span class="badge">'+current.products.length+' produto(s)</span>'+
 '</div>'+
 '<button class="back" onclick="home()">← Início</button>'+
 '</div>'+

 '<hr>'+

 '<div class="step">ETAPA 1 — ESCANEAR CÓDIGO DE BARRAS</div>'+

 '<div class="camera">'+

 '<div id="cammsg" class="camera-title">Abrindo câmera...</div>'+

 '<div class="video-wrap">'+

 '<video id="video" autoplay playsinline muted></video>'+

 '<div id="scanarea" class="scan-area">'+
 '<span>Posicione o código de barras aqui</span>'+
 '</div>'+

 '<div id="scanline" class="scanline"></div>'+

 '<div id="photoframe" class="photo-frame hidden">'+
 '<span>Enquadre o produto aqui</span>'+
 '</div>'+

 '</div>'+
 '</div>'+

 '<div id="scanstatus" class="status">📷 Preparando câmera...</div>'+

 '<label>Código de barras'+
 '<input id="pbar" inputmode="numeric" pattern="[0-9]*" placeholder="Código preenchido automaticamente">'+
 '</label>'+

 '<div id="photoSection" class="hidden">'+

 '<div class="step">ETAPA 2 — FOTO DO PRODUTO</div>'+

 '<button class="primary" onclick="tirarFoto()">📸 Tirar foto do produto</button>'+

 '<img id="photoPreview" class="photo-preview hidden" alt="Foto do produto">'+

 '</div>'+

 '<div id="dataSection" class="hidden">'+

 '<div class="step">ETAPA 3 — VALIDADE E QUANTIDADE</div>'+

 '<div class="row">'+

 '<label>Validade'+
 '<input id="pexp" type="date">'+
 '</label>'+

 '<label>Quantidade'+
 '<input id="pqty" type="number" min="1" value="1">'+
 '</label>'+

 '</div>'+

 '<label>Setor'+
 '<input id="psector" placeholder="Ex.: Câmara Fria">'+
 '</label>'+

 '<button class="green" onclick="addProduct()">💾 Salvar produto</button>'+

 '</div>'+

 '<div style="margin-top:18px">'+
 '<h3>Produtos desta lista</h3>'+
 '<div id="products"></div>'+
 '</div>'+

 '<button class="primary" style="margin-top:15px" onclick="finishList()">✅ Finalizar lista</button>'+

 '</section>';

 renderProducts();

 setTimeout(iniciarLeituraCodigo,400);
}

function renderProducts(){

 var el=document.getElementById("products");

 if(!el||!current)return;

 if(!current.products.length){
  el.innerHTML='<p class="muted">Nenhum produto cadastrado ainda.</p>';
  return;
 }

 el.innerHTML=current.products.map(function(p,i){

  return '<div class="product">'+
   '<div class="code-number">'+
   (i+1)+'. '+esc(p.bar)+
   '</div>'+

   (p.photo?
    '<img src="'+p.photo+'" class="report-photo" alt="Produto">':
    "")+

   '<div><b>Validade:</b> '+esc(formatDate(p.exp))+'</div>'+
   '<div><b>Quantidade:</b> '+esc(p.qty)+'</div>'+

   (p.sector?
    '<div class="muted">Setor: '+esc(p.sector)+'</div>':
    "")+

   '</div>';

 }).join("");
}

function iniciarLeituraCodigo(){

 cameraMode="barcode";

 var video=document.getElementById("video");
 var status=document.getElementById("scanstatus");
 var msg=document.getElementById("cammsg");

 if(!video)return;

 stopCam();

 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){

  if(status)
   status.textContent="⚠️ Câmera indisponível.";

  return;
 }

 if(msg)
  msg.textContent="Aponte para o código de barras.";

 if(status)
  status.textContent="🔎 Procurando código...";

 navigator.mediaDevices.getUserMedia({
  audio:false,
  video:{
   facingMode:{ideal:"environment"},
   width:{ideal:1280},
   height:{ideal:720},
   frameRate:{ideal:30,max:60}
  }
 })
 .then(function(s){

  stream=s;
  video.srcObject=s;

  return video.play();

 })
 .then(function(){

  if(!window.BarcodeDetector){

   if(status)
    status.textContent="⚠️ Leitura automática indisponível. Digite o código.";

   return;
  }

  return BarcodeDetector.getSupportedFormats().then(function(formats){

   var pref=[
    "ean_13",
    "ean_8",
    "upc_a",
    "upc_e",
    "code_128",
    "itf"
   ];

   var valid=pref.filter(function(f){
    return formats.indexOf(f)>=0;
   });

   var detector=new BarcodeDetector({
    formats:valid.length?valid:formats
   });

   var busy=false;

   scanTimer=setInterval(function(){

    if(cameraMode!=="barcode"||busy||!video.videoWidth)
     return;

    busy=true;

    detector.detect(video)

    .then(function(codes){

     if(codes&&codes.length){

      var codigo=String(
       codes[0].rawValue||""
      ).replace(/\D/g,"");

      if(codigo){

       var input=document.getElementById("pbar");

       if(input)
        input.value=codigo;

       if(scanTimer){
        clearInterval(scanTimer);
        scanTimer=null;
       }

       if(status)
        status.textContent="✅ Código lido: "+codigo;

       if(msg)
        msg.textContent="Código lido. Abrindo câmera para foto...";

       setTimeout(iniciarCameraFoto,400);
      }
     }

    })

    .catch(function(e){
     console.log("Scanner:",e);
    })

    .then(function(){
     busy=false;
    });

   },120);

  });

 })

 .catch(function(e){

  console.log("Câmera:",e);

  if(status)
   status.textContent="⚠️ Não foi possível abrir a câmera. Verifique a permissão.";

 });
}

function iniciarCameraFoto(){

 cameraMode="photo";

 if(scanTimer){
  clearInterval(scanTimer);
  scanTimer=null;
 }

 stopCameraTracksOnly();

 var video=document.getElementById("video");
 var status=document.getElementById("scanstatus");
 var msg=document.getElementById("cammsg");
 var scanarea=document.getElementById("scanarea");
 var scanline=document.getElementById("scanline");
 var frame=document.getElementById("photoframe");
 var section=document.getElementById("photoSection");

 if(!video)return;

 if(scanarea)
  scanarea.classList.add("hidden");

 if(scanline)
  scanline.classList.add("hidden");

 if(frame)
  frame.classList.remove("hidden");

 if(section)
  section.classList.remove("hidden");

 if(msg)
  msg.textContent="Agora enquadre o produto e tire a foto.";

 if(status)
  status.textContent="📸 Câmera pronta para fotografar.";

 navigator.mediaDevices.getUserMedia({
  audio:false,
  video:{
   facingMode:{ideal:"environment"},
   width:{ideal:1920},
   height:{ideal:1080}
  }
 })
 .then(function(s){

  stream=s;
  video.srcObject=s;

  return video.play();

 })
 .catch(function(e){

  console.log("Foto:",e);

  if(status)
   status.textContent="⚠️ Não foi possível abrir a câmera para a foto.";

 });
}

function tirarFoto(){

 if(cameraMode!=="photo"){
  iniciarCameraFoto();
  return;
 }

 var video=document.getElementById("video");

 if(!video||!video.videoWidth){
  alert("A câmera ainda não está pronta.");
  return;
 }

 var ratio=2.4;

 var vw=video.videoWidth;
 var vh=video.videoHeight;

 var cw=vw;
 var ch=Math.round(vw/ratio);

 if(ch>vh){
  ch=vh;
  cw=Math.round(vh*ratio);
 }

 var sx=Math.round((vw-cw)/2);
 var sy=Math.round((vh-ch)/2);

 var canvas=document.createElement("canvas");

 canvas.width=1200;
 canvas.height=500;

 canvas.getContext("2d").drawImage(
  video,
  sx,
  sy,
  cw,
  ch,
  0,
  0,
  1200,
  500
 );

 currentPhoto=canvas.toDataURL("image/jpeg",.82);

 var preview=document.getElementById("photoPreview");

 if(preview){
  preview.src=currentPhoto;
  preview.classList.remove("hidden");
 }

 stopCam();

 var status=document.getElementById("scanstatus");
 var msg=document.getElementById("cammsg");
 var data=document.getElementById("dataSection");

 if(status)
  status.textContent="✅ Foto capturada.";

 if(msg)
  msg.textContent="Foto pronta. Informe validade e quantidade.";

 if(data)
  data.classList.remove("hidden");
}

function stopCameraTracksOnly(){

 if(stream){
  stream.getTracks().forEach(function(t){
   t.stop();
  });

  stream=null;
 }
}

function stopCam(){

 if(scanTimer){
  clearInterval(scanTimer);
  scanTimer=null;
 }

 stopCameraTracksOnly();
}

function addProduct(){

 if(!current)return;

 var b=document.getElementById("pbar");
 var e=document.getElementById("pexp");
 var q=document.getElementById("pqty");
 var s=document.getElementById("psector");

 var bar=b?
  String(b.value||"").replace(/\D/g,""):
  "";

 var exp=e?
  e.value:
  "";

 var qty=q?
  Number(q.value||0):
  0;

 var sector=s?
  String(s.value||"").trim():
  "";

 if(!bar){
  alert("Leia o código de barras.");
  return;
 }

 if(!currentPhoto){
  alert("Tire a foto do produto.");
  return;
 }

 if(!exp){
  alert("Informe a validade.");
  return;
 }

 if(qty<1){
  alert("Informe uma quantidade válida.");
  return;
 }

 current.products.push({
  bar:bar,
  photo:currentPhoto,
  exp:exp,
  qty:qty,
  sector:sector
 });

 save();

 currentPhoto="";

 editor();
}

function finishList(){

 stopCam();

 if(!current||!current.products.length){
  alert("Cadastre pelo menos um produto.");
  return;
 }

 var index=db.lists.findIndex(function(x){
  return x.id===current.id;
 });

 if(index<0)
  db.lists.push(current);
 else
  db.lists[index]=current;

 save();

 alert("Lista salva no aparelho!");

 current=null;
 currentPhoto="";

 home();
}

function lists(){

 stopCam();

 var html=
 '<section class="card">'+
 '<div class="top">'+
 '<h2>Minhas listas</h2>'+
 '<button class="back" onclick="home()">← Início</button>'+
 '</div>';

 if(db.lists.length){

  html+=db.lists.map(function(l){

   return '<div class="listbox">'+
    '<b>'+esc(l.name)+'</b><br>'+
    '<span class="muted">'+
    l.products.length+
    ' produto(s) • '+
    esc(l.created)+
    '</span><br>'+
    '<button class="light" style="margin-top:8px" onclick="openList('+l.id+')">Abrir lista</button>'+
    '</div>';

  }).join("");

 }else{

  html+='<p class="muted">Nenhuma lista finalizada.</p>';

 }

 html+='</section>';

 app().innerHTML=html;
}

function openList(id){

 current=db.lists.find(function(x){
  return x.id===id;
 })||null;

 if(current)
  editor();
}

function reports(){

 stopCam();

 var html=
 '<section class="card">'+
 '<div class="top">'+
 '<h2>Relatório final</h2>'+
 '<button class="back" onclick="home()">← Início</button>'+
 '</div>';

 if(db.lists.length){

  html+=db.lists.map(function(l){

   var products=l.products.map(function(p,i){

    return '<div class="product">'+

     '<div class="code-number">'+
     (i+1)+'. '+esc(p.bar)+
     '</div>'+

     (p.photo?
      '<img src="'+p.photo+'" class="report-photo" alt="Produto">':
      "")+

     '<div><b>Validade:</b> '+
     esc(formatDate(p.exp))+
     '</div>'+

     '<div><b>Quantidade:</b> '+
     esc(p.qty)+
     '</div>'+

     (p.sector?
      '<div class="muted">Setor: '+
      esc(p.sector)+
      '</div>':
      "")+

     '</div>';

   }).join("");

   return '<div class="listbox">'+

    '<b>'+esc(l.name)+'</b><br>'+

    '<span class="muted">'+
    l.products.length+
    ' produto(s) • '+
    esc(l.created)+
    '</span>'+

    '<div style="margin-top:12px">'+
    products+
    '</div>'+

    '<div class="report-actions">'+

    '<button class="primary" onclick="generatePDF('+l.id+')">'+
    '📄 Gerar PDF da lista'+
    '</button>'+

    '<button class="whatsapp" onclick="sharePDFWhatsApp('+l.id+')">'+
    '📲 Enviar PDF pelo WhatsApp'+
    '</button>'+

    '</div>'+

    '<div id="pdfStatus-'+l.id+'" class="pdf-status"></div>'+

    '</div>';

  }).join("");

 }else{

  html+='<p class="muted">Finalize uma lista para vê-la aqui.</p>';

 }

 html+='</section>';

 app().innerHTML=html;
}

function getPDFConstructor(){

 return window.jspdf&&
 typeof window.jspdf.jsPDF==="function"?
 window.jspdf.jsPDF:
 null;
}

function loadPDF(){

 return new Promise(function(resolve,reject){

  var c=getPDFConstructor();

  if(c){
   resolve(c);
   return;
  }

  var old=document.getElementById("jspdf-loader");

  if(old){

   old.addEventListener("load",function(){

    var x=getPDFConstructor();

    if(x)
     resolve(x);
    else
     reject(new Error("Gerador PDF indisponível"));

   });

   old.addEventListener("error",function(){
    reject(new Error("Não foi possível carregar o gerador PDF"));
   });

   return;
  }

  var s=document.createElement("script");

  s.id="jspdf-loader";

  s.src=
   "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";

  s.onload=function(){

   var x=getPDFConstructor();

   if(x)
    resolve(x);
   else
    reject(new Error("Gerador PDF indisponível"));

  };

  s.onerror=function(){

   reject(
    new Error("Não foi possível carregar o gerador PDF")
   );

  };

  document.head.appendChild(s);
 });
}

function createPDF(id,jsPDF){

 var l=db.lists.find(function(x){
  return x.id===id;
 });

 if(!l)
  throw new Error("Lista não encontrada.");

 var doc=new jsPDF({
  orientation:"portrait",
  unit:"mm",
  format:"a4"
 });

 doc.setFont("helvetica","bold");
 doc.setFontSize(20);
 doc.text("VALIDADE-",14,18);

 doc.setFont("helvetica","normal");
 doc.setFontSize(13);
 doc.text(String(l.name).slice(0,55),14,27);

 doc.setFontSize(9);
 doc.text("Relatório de vencimentos",14,34);
 doc.text("Data: "+String(l.created),145,34);

 var y=44;

 l.products.forEach(function(p,index){

  if(y+50>285){
   doc.addPage();
   y=20;
  }

  doc.setFont("helvetica","bold");
  doc.setFontSize(10);

  doc.text(
   (index+1)+". Codigo: "+String(p.bar),
   14,
   y
  );

  doc.setFont("helvetica","normal");

  y+=5;

  if(p.photo){

   try{

    doc.addImage(
     p.photo,
     "JPEG",
     14,
     y,
     60,
     25
    );

   }catch(e){
    console.log(e);
   }
  }

  var x=82;

  doc.setFontSize(9);

  doc.text("Validade:",x,y+6);
  doc.text(formatDate(p.exp),x+23,y+6);

  doc.text("Quantidade:",x,y+13);
  doc.text(String(p.qty),x+25,y+13);

  if(p.sector){

   doc.text("Setor:",x,y+20);

   doc.text(
    String(p.sector).slice(0,35),
    x+15,
    y+20
   );
  }

  y+=33;

  doc.line(14,y,196,y);

  y+=8;
 });

 if(y+10>285){
  doc.addPage();
  y=20;
 }

 doc.text(
  "Total de produtos: "+l.products.length,
  14,
  y
 );

 return doc;
}

function pdfFileName(l){

 var n=String(l.name)
  .replace(/[^a-z0-9À-ÿ]+/gi,"-")
  .replace(/^-+|-+$/g,"");

 return "Validade-"+(n||"Lista")+".pdf";
}

function generatePDF(id){

 var status=document.getElementById("pdfStatus-"+id);

 if(status)
  status.textContent="⏳ Gerando PDF...";

 loadPDF()

 .then(function(jsPDF){

/* =====================================================
   CONVERTER BLOB PARA BASE64
===================================================== */

function blobToBase64(blob){

 return new Promise(function(resolve,reject){

  var reader=new FileReader();

  reader.onloadend=function(){

   try{

    var result=String(reader.result||"");

    var comma=result.indexOf(",");

    if(comma>=0)
     result=result.substring(comma+1);

    resolve(result);

   }catch(e){
    reject(e);
   }
  };

  reader.onerror=function(){
   reject(reader.error||new Error("Erro ao ler PDF"));
  };

  reader.readAsDataURL(blob);
 });
}


/* =====================================================
   COMPARTILHAR PDF NATIVAMENTE NO ANDROID
===================================================== */

async function sharePDFWhatsApp(id){

 var status=document.getElementById("pdfStatus-"+id);

 try{

  if(status)
   status.textContent="⏳ Preparando PDF para WhatsApp...";

  var jsPDF=await loadPDF();

  var l=db.lists.find(function(x){
   return x.id===id;
  });

  if(!l)
   throw new Error("Lista não encontrada.");

  var doc=createPDF(id,jsPDF);

  var blob=doc.output("blob");

  /*
   * Capacitor disponibiliza os plugins nativos
   * através de window.Capacitor.Plugins.
   */

  var cap=window.Capacitor;

  if(
   !cap||
   !cap.Plugins
  ){
   throw new Error(
    "Suporte nativo do aplicativo não encontrado."
   );
  }

  var Filesystem=cap.Plugins.Filesystem;
  var Share=cap.Plugins.Share;

  if(
   !Filesystem||
   !Share
  ){
   throw new Error(
    "Plugins nativos de compartilhamento não encontrados."
   );
  }

  if(status)
   status.textContent="⏳ Salvando PDF no aparelho...";

  var base64=await blobToBase64(blob);

  var filename=pdfFileName(l);

  /*
   * O arquivo é gravado no Cache do aplicativo.
   * Isso permite que o Android gere uma URI
   * compartilhável para outros aplicativos.
   */

  await Filesystem.writeFile({
   path:filename,
   data:base64,
   directory:"CACHE",
   recursive:true
  });

  var uriResult=await Filesystem.getUri({
   path:filename,
   directory:"CACHE"
  });

  var uri=uriResult&&uriResult.uri;

  if(!uri){
   throw new Error(
    "Não foi possível obter a URI do PDF."
   );
  }

  if(status)
   status.textContent="📲 Abrindo compartilhamento do Android...";

  /*
   * O Share nativo recebe o arquivo PDF.
   * O Android então apresenta WhatsApp e os
   * demais aplicativos compatíveis.
   */

  await Share.share({

   title:"Validade- - "+l.name,

   text:"Relatório de validade - "+l.name,

   files:[uri]

  });

  if(status)
   status.textContent="✅ PDF enviado para o compartilhamento.";

 }catch(e){

  console.error(
   "Erro ao compartilhar PDF:",
   e
  );

  if(e&&(
   e.name==="AbortError"||
   e.code==="ERR_CANCELED"
  )){
   if(status)
    status.textContent="";

   return;
  }

  /*
   * Fallback somente se o compartilhamento nativo
   * não estiver disponível.
   */

  try{

   var jsPDF2=await loadPDF();

   var l2=db.lists.find(function(x){
    return x.id===id;
   });

   if(!l2)
    throw new Error("Lista não encontrada.");

   var blob2=createPDF(id,jsPDF2).output("blob");

   compartilharPDFAlternativo(blob2,l2);

  }catch(e2){

   console.error(e2);

   if(status)
    status.textContent="";

   alert(
    "Não foi possível enviar o PDF. Tente gerar o PDF primeiro."
   );
  }
 }
}


/* =====================================================
   ALTERNATIVA PARA NAVEGADOR
===================================================== */

function compartilharPDFAlternativo(blob,l){

 /*
  * Esta alternativa é usada apenas quando o
  * compartilhamento nativo do Android não estiver
  * disponível.
  */

 if(
  navigator.share&&
  typeof navigator.share==="function"
 ){

  try{

   var file=new File(
    [blob],
    pdfFileName(l),
    {
     type:"application/pdf"
    }
   );

   navigator.share({

    title:"Validade- - "+l.name,

    text:"Relatório de validade - "+l.name,

    files:[file]

   }).catch(function(e){

    if(e&&e.name==="AbortError")
     return;

    console.log(
     "Share Web indisponível:",
     e
    );

    baixarPDFEAbrirWhatsApp(blob,l);

   });

   return;

  }catch(e){

   console.log(
    "Erro no Share Web:",
    e
   );
  }
 }

 baixarPDFEAbrirWhatsApp(blob,l);
}

function baixarPDFEAbrirWhatsApp(blob,l){

 var url=URL.createObjectURL(blob);

 var a=document.createElement("a");

 a.href=url;
 a.download=pdfFileName(l);
 a.style.display="none";

 document.body.appendChild(a);

 a.click();

 document.body.removeChild(a);

 setTimeout(function(){

  URL.revokeObjectURL(url);

 },5000);

 setTimeout(function(){

  var texto=
   encodeURIComponent(
    "Relatório de validade - "+l.name
   );

  var whatsappUrl=
   "https://wa.me/?text="+texto;

  window.location.href=whatsappUrl;

 },700);
}
