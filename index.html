<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Validade-</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#071d49,#1265d8);color:white;padding:24px 18px 20px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0;opacity:.85}
main{max-width:620px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #102a4d14}
button{border:0;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#1265d8;color:white;width:100%}
.green{background:#16a36b;color:white;width:100%}
.light{background:#eaf1fb;color:#17457f}
.danger{background:#feecec;color:#b42318;width:100%}
.actions{display:grid;gap:12px}
.muted{color:#68758a;font-size:14px}
.hidden{display:none!important}
input{width:100%;padding:13px;border:1px solid #ccd6e4;border-radius:11px;font-size:16px;margin-top:7px}
label{display:block;margin:13px 0;font-weight:700;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{background:transparent;color:#1265d8;padding:5px 0}
.listbox{border:1px solid #dce4ef;border-radius:13px;padding:13px;margin:10px 0}
.product{border-left:4px solid #1265d8;padding:11px;background:#f7f9fc;border-radius:9px;margin-top:9px}
.badge{display:inline-block;background:#e8f4ff;color:#1265d8;border-radius:20px;padding:5px 9px;font-size:12px}
.camera{background:#101722;border-radius:16px;padding:14px;color:white;text-align:center}
video{width:100%;max-height:240px;object-fit:cover;border-radius:11px;background:#05080d}
.scanline{height:3px;background:#31d78c;margin:-60px 12% 45px;border-radius:5px;position:relative}
.status{padding:10px;border-radius:10px;background:#eef7f1;color:#17663f;font-size:14px}
</style>
</head>
<body>

<header>
<h1>Validade-</
