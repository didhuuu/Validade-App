<body>

<header>
  <h1>Validade-</h1>
  <p>Controle de vencimentos</p>
</header>

<main id="app">

<section class="card">
  <h2>Carregando...</h2>
  <p class="muted">Inicializando aplicativo.</p>
</section>

</main>

<script>

/* =====================================================
   BANCO LOCAL
===================================================== */

const KEY = "validade_app_v2";

let db = {
  lists:[]
};

let current = null;
let stream = null;
let scanTimer = null;


/* =====================================================
   CARREGAR
===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(KEY);

    if(saved){

      const parsed =
        JSON.parse(saved);

      if(
        parsed &&
        Array.isArray(parsed.lists)
      ){

        db = parsed;

      }

    }

  }catch(error){

    console.log(
      "Erro ao carregar:",
      error
    );

    db = {
      lists:[]
    };

  }

}


/* =====================================================
   SALVAR
===================================================== */

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(db)
    );

  }catch(error){

    console.log(
      "Erro ao salvar:",
      error
    );

  }

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m];

    });

}


/* =====================================================
   APP
===================================================== */

function app(){

  return document.getElementById("app");

}


/* =====================================================
   INÍCIO
===================================================== */

function home(){

  stopCam();

  app().innerHTML = `

    <section class="card">

      <h2>Início</h2>

      <p class="muted">
        Controle seus produtos e datas de validade.
      </p>

      <div class="actions">

        <button
          class="primary"
          onclick="newList()">
          ➕ Criar nova lista
        </button>

        <button
          class="light"
          onclick="lists()">
          📋 Minhas listas
        </button>

        <button
          class="light"
          onclick="reports()">
          📄 Relatório final
        </button>

        <button
          class="danger"
          onclick="clearData()">
          🗑 Limpar dados
        </button>

      </div>

    </section>

    <section class="card">

      <b>Fluxo</b>

      <p class="muted">
        Criar lista →
        código de barras →
        descrição →
        validade →
        quantidade →
        salvar →
        finalizar.
      </p>

    </section>

  `;

}


/* =====================================================
   NOVA LISTA
===================================================== */

function newList(){

  app().innerHTML = `

    <section class="card">

      <div class="top">

        <h2>Nova lista</h2>

        <button
          class="back"
          onclick="home()">
          ← Voltar
        </button>

      </div>

      <label>

        Nome da lista

        <input
          id="lname"
          placeholder="Ex.: Câmara Fria – 11/09">

      </label>

      <button
        class="primary"
        onclick="createList()">
        Criar lista
      </button>

    </section>

  `;

}


/* =====================================================
   CRIAR LISTA
===================================================== */

function createList(){

  const input =
    document.getElementById("lname");

  if(!input) return;

  const name =
    input.value.trim();

  if(!name){

    alert(
      "Digite o nome da lista."
    );

    return;

  }

  current = {

    id:Date.now(),

    name:name,

    created:new Date()
      .toLocaleDateString("pt-BR"),

    products:[]

  };

  editor();

}


/* =====================================================
   EDITOR
===================================================== */

function editor(){

  stopCam();

  if(!current){

    home();

    return;

  }

  app().innerHTML = `

    <section class="card">

      <div class="top">

        <div>

          <h2>
            ${esc(current.name)}
          </h2>

          <span class="badge">
            ${current.products.length}
            produto(s)
          </span>

        </div>

        <button
          class="back"
          onclick="home()">
          ← Início
        </button>

      </div>

      <hr>

      <div class="camera">

        <div
          id="cammsg"
          class="camera-title">
          A câmera será aberta para
          ler o código de barras.
        </div>

        <div class="video-wrap">

          <video
            id="video"
            autoplay
            playsinline
            muted
            class="hidden">
          </video>

          <div
            id="scanarea"
            class="scan-area hidden">

            <span>
              Posicione o produto nesta área
            </span>

          </div>

          <div
            id="scanline"
            class="scanline hidden">
          </div>

        </div>

      </div>

      <button
        id="scanbutton"
        class="primary"
        style="margin-top:10px"
        onclick="startScan()">
        📷 Ler código de barras
      </button>

      <div
        id="scanstatus"
        class="status hidden"
        style="margin-top:10px">
      </div>

      <label>

        1️⃣ Código de barras

        <input
          id="pbar"
          inputmode="numeric"
          placeholder="Leia o código de barras">

      </label>

      <div class="photo-box">

        <div class="photo-title">
          📸 Descrição do produto
        </div>

        <div class="photo-help">
          Depois de ler o código, fotografe
          o nome do produto na embalagem.
        </div>

        <input
          id="fotoDescricao"
          type="file"
          accept="image/*"
          capture="environment"
          class="hidden"
          onchange="processarFotoDescricao(this)">

        <button
          class="primary"
          style="margin-top:10px"
          onclick="abrirFotoDescricao()">
          📸 Fotografar descrição
        </button>

      </div>

      <label>

        2️⃣ Descrição do produto

        <input
          id="pname"
          placeholder="Descrição do produto">

      </label>

      <div class="row">

        <label>

          3️⃣ Validade

          <input
            id="pexp"
            type="date">

        </label>

        <label>

          4️⃣ Quantidade

          <input
            id="pqty"
            type="number"
            min="1"
            value="1">

        </label>

      </div>

      <label>

        Setor

        <input
          id="psector"
          placeholder="Ex.: Câmara Fria">

      </label>

      <button
        class="green"
        onclick="addProduct()">
        💾 Salvar produto
      </button>

      <div style="margin-top:16px">

        <h3>
          Produtos desta lista
        </h3>

        <div id="products"></div>

      </div>

      <button
        class="primary"
        style="margin-top:15px"
        onclick="finishList()">
        ✅ Finalizar lista
      </button>

    </section>

  `;

  renderProducts();

}


/* =====================================================
   PRODUTOS
===================================================== */

function renderProducts(){

  const el =
    document.getElementById("products");

  if(!el || !current) return;

  if(!current.products.length){

    el.innerHTML =
      '<p class="muted">Nenhum produto cadastrado ainda.</p>';

    return;

  }

  el.innerHTML =
    current.products
      .map(function(p,i){

        return `

          <div class="product">

            <b>
              ${i+1}.
              ${esc(p.bar)}
            </b>

            <br>

            ${esc(p.name)}

            <br>

            <span class="muted">

              Validade:
              ${esc(p.exp)}

              • Quantidade:
              ${p.qty}

              ${
                p.sector
                ? " • Setor: " +
                  esc(p.sector)
                : ""
              }

            </span>

          </div>

        `;

      })
      .join("");

}


/* =====================================================
   INICIAR CÂMERA
===================================================== */

async function startScan(){

  const status =
    document.getElementById(
      "scanstatus"
    );

  const video =
    document.getElementById(
      "video"
    );

  const cammsg =
    document.getElementById(
      "cammsg"
    );

  if(!status || !video)
    return;

  status.classList.remove(
    "hidden"
  );

  status.classList.remove(
    "processing"
  );

  status.textContent =
    "📷 Abrindo câmera...";

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      status.textContent =
        "⚠️ A câmera não está disponível neste aparelho.";

      return;

    }

    stopCam();

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        audio:false,

        video:{

          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }

        }

      });

    video.srcObject =
      stream;

    video.classList.remove(
      "hidden"
    );

    const scanline =
      document.getElementById(
        "scanline"
      );

    const scanarea =
      document.getElementById(
        "scanarea"
      );

    if(scanline){

      scanline.classList.remove(
        "hidden"
      );

    }

    if(scanarea){

      scanarea.classList.remove(
        "hidden"
      );

    }

    if(cammsg){

      cammsg.textContent =
        "Aponte para o código de barras.";

    }

    status.textContent =
      "🔎 Procurando código de barras...";

    if(
      !("BarcodeDetector" in window)
    ){

      status.textContent =
        "⚠️ Leitor automático indisponível. Digite o código manualmente.";

      return;

    }

    let formats = [];

    try{

      formats =
        await BarcodeDetector
        .getSupportedFormats();

    }catch(error){

      formats = [];

    }

    let detector;

    try{

      detector =
        formats.length
        ? new BarcodeDetector({
            formats:formats
          })
        : new BarcodeDetector();

    }catch(error){

      detector =
        new BarcodeDetector();

    }

    scanTimer =
      setInterval(
        async function(){

          if(
            !video.videoWidth ||
            !video.videoHeight
          ){

            return;

          }

          try{

            const codes =
              await detector.detect(
                video
              );

            if(
              codes &&
              codes.length &&
              codes[0].rawValue
            ){

              const codigo =
                codes[0].rawValue;

              const input =
                document.getElementById(
                  "pbar"
                );

              if(input){

                input.value =
                  codigo;

              }

              clearInterval(
                scanTimer
              );

              scanTimer = null;

              status.textContent =
                "✅ Código lido: " +
                codigo;

              if(cammsg){

                cammsg.textContent =
                  "Código lido. Agora fotografe a descrição.";

              }

            }

          }catch(error){

            console.log(
              "Erro no leitor:",
              error
            );

          }

        },
        500
      );

  }catch(error){

    console.log(
      "Erro câmera:",
      error
    );

    status.textContent =
      "⚠️ Não foi possível abrir a câmera. Verifique a permissão do aplicativo.";

  }

}


/* =====================================================
   FOTO DA DESCRIÇÃO
===================================================== */

function abrirFotoDescricao(){

  const codigo =
    document.getElementById(
      "pbar"
    );

  if(
    !codigo ||
    !codigo.value.trim()
  ){

    alert(
      "Leia primeiro o código de barras."
    );

    return;

  }

  const input =
    document.getElementById(
      "fotoDescricao"
    );

  if(input){

    input.value = "";

    input.click();

  }

}


/* =====================================================
   CARREGAR IMAGEM
===================================================== */

function carregarImagemOCR(
  arquivo
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const img =
            new Image();

          img.onload =
            function(){

              resolve(img);

            };

          img.onerror =
            reject;

          img.src =
            reader.result;

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        arquivo
      );

    }
  );

}


/* =====================================================
   PREPARAR FOTO
===================================================== */

function prepararFotoParaOCR(
  imagem,
  modo
){

  const maxWidth =
    1600;

  let largura =
    imagem.width;

  let altura =
    imagem.height;

  if(largura > maxWidth){

    const escala =
      maxWidth / largura;

    largura =
      Math.floor(
        largura * escala
      );

    altura =
      Math.floor(
        altura * escala
      );

  }

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    largura;

  canvas.height =
    altura;

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );

  if(!ctx)
    return null;

  ctx.drawImage(
    imagem,
    0,
    0,
    largura,
    altura
  );

  const dados =
    ctx.getImageData(
      0,
      0,
      largura,
      altura
    );

  for(
    let i=0;
    i<dados.data.length;
    i+=4
  ){

    const r =
      dados.data[i];

    const g =
      dados.data[i+1];

    const b =
      dados.data[i+2];

    let cinza =
      r*0.299 +
      g*0.587 +
      b*0.114;

    if(modo === 1){

      cinza =
        (cinza-128)*1.5+128;

    }

    if(modo === 2){

      cinza =
        cinza > 145
        ? 255
        : 0;

    }

    cinza =
      Math.max(
        0,
        Math.min(
          255,
          cinza
        )
      );

    dados.data[i] =
      cinza;

    dados.data[i+1] =
      cinza;

    dados.data[i+2] =
      cinza;

  }

  ctx.putImageData(
    dados,
    0,
    0
  );

  return canvas;

}


/* =====================================================
   LIMPAR OCR
===================================================== */

function limparTextoProduto(
  text
){

  let resultado =
    String(text || "");

  resultado =
    resultado
      .replace(/\r/g," ")
      .replace(/\n+/g," ")
      .replace(/\s+/g," ")
      .trim();

  resultado =
    resultado.replace(
      /[^A-Za-zÀ-ÿ0-9\s.,()\/&%+\-ºª°]/g,
      ""
    );

  resultado =
    resultado
      .replace(/\s+/g," ")
      .trim();

  return resultado.slice(
    0,
    120
  );

}


/* =====================================================
   PONTUAR OCR
===================================================== */

function pontuarDescricao(
  texto,
  confianca
){

  const limpo =
    limparTextoProduto(
      texto
    );

  if(!limpo){

    return {
      text:"",
      score:0
    };

  }

  const letras =
    (
      limpo.match(
        /[A-Za-zÀ-ÿ]/g
      ) || []
    ).length;

  const numeros =
    (
      limpo.match(
        /[0-9]/g
      ) || []
    ).length;

  const palavras =
    limpo
      .split(/\s+/)
      .filter(function(x){

        return x.length >= 2;

      }).length;

  let score =
    Number(
      confianca || 0
    );

  score +=
    Math.min(
      letras*1.5,
      35
    );

  score +=
    Math.min(
      palavras*3,
      20
    );

  if(numeros > letras){

    score -= 25;

  }

  if(limpo.length < 5){

    score -= 50;

  }

  return {
    text:limpo,
    score:score
  };

}


/* =====================================================
   EXECUTAR OCR
===================================================== */

async function executarOCROnFoto(
  imagem
){

  if(!window.Tesseract){

    return null;

  }

  const resultados = [];

  for(
    let modo=0;
    modo<=2;
    modo++
  ){

    const canvas =
      prepararFotoParaOCR(
        imagem,
        modo
      );

    if(!canvas)
      continue;

    try{

      const resultado =
        await Tesseract.recognize(
          canvas,
          "por",
          {
            logger:function(){},

            tessedit_pageseg_mode:6

          }
        );

      resultados.push(
        pontuarDescricao(
          resultado?.data?.text,
          resultado?.data?.confidence
        )
      );

    }catch(error){

      console.log(
        "Erro OCR:",
        error
      );

    }

  }

  resultados.sort(
    function(a,b){

      return b.score-a.score;

    }
  );

  return resultados.length
    ? resultados[0]
    : null;

}


/* =====================================================
   PROCESSAR FOTO
===================================================== */

async function processarFotoDescricao(
  input
){

  if(
    !input ||
    !input.files ||
    !input.files.length
  ){

    return;

  }

  const status =
    document.getElementById(
      "scanstatus"
    );

  const name =
    document.getElementById(
      "pname"
    );

  if(status){

    status.classList.remove(
      "hidden"
    );

    status.classList.add(
      "processing"
    );

    status.textContent =
      "🔎 Analisando a foto da descrição...";

  }

  try{

    const imagem =
      await carregarImagemOCR(
        input.files[0]
      );

    const resultado =
      await executarOCROnFoto(
        imagem
      );

    if(
      resultado &&
      resultado.text &&
      resultado.score >= 40
    ){

      if(name){

        name.value =
          resultado.text;

      }

      if(status){

        status.classList.remove(
          "processing"
        );

        status.textContent =
          "✅ Descrição encontrada. Confira antes de salvar.";

      }

    }else{

      if(status){

        status.classList.remove(
          "processing"
        );

        status.textContent =
          "⚠️ Não consegui identificar bem a descrição. Tire outra foto mais próxima e nítida.";

      }

    }

  }catch(error){

    console.log(
      "Erro ao processar foto:",
      error
    );

    if(status){

      status.classList.remove(
        "processing"
      );

      status.textContent =
        "⚠️ Não foi possível analisar a foto.";

    }

  }

}


/* =====================================================
   PARAR CÂMERA
===================================================== */

function stopCam(){

  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer = null;

  }

  if(stream){

    stream
      .getTracks()
      .forEach(function(track){

        track.stop();

      });

    stream = null;

  }

}


/* =====================================================
   ADICIONAR PRODUTO
===================================================== */

function addProduct(){

  if(!current)
    return;

  const bar =
    document.getElementById(
      "pbar"
    ).value.trim();

  const name =
    document.getElementById(
      "pname"
    ).value.trim();

  const exp =
    document.getElementById(
      "pexp"
    ).value;

  const qty =
    Number(
      document.getElementById(
        "pqty"
      ).value || 0
    );

  const sector =
    document.getElementById(
      "psector"
    ).value.trim();

  if(
    !bar ||
    !name ||
    !exp ||
    qty < 1
  ){

    alert(
      "Preencha código, descrição, validade e quantidade."
    );

    return;

  }

  current.products.push({

    bar:bar,

    name:name,

    exp:exp,

    qty:qty,

    sector:sector

  });

  save();

  editor();

}


/* =====================================================
   FINALIZAR
===================================================== */

function finishList(){

  stopCam();

  if(
    !current ||
    !current.products.length
  ){

    alert(
      "Cadastre pelo menos um produto antes de finalizar."
    );

    return;

  }

  const index =
    db.lists.findIndex(
      function(item){

        return item.id === current.id;

      }
    );

  if(index < 0){

    db.lists.push(
      current
    );

  }else{

    db.lists[index] =
      current;

  }

  save();

  alert(
    "Lista salva no aparelho!"
  );

  current = null;

  home();

}

/* =====================================================
   GERAR PDF
===================================================== */

function generatePDF(id){

  const l =
    db.lists.find(
      function(item){

        return item.id === id;

      }
    );

  if(!l)
    return;

  if(!window.jspdf){

    alert(
      "O gerador de PDF ainda está carregando. Tente novamente."
    );

    return;

  }

  const jsPDF =
    window.jspdf.jsPDF;

  const doc =
    new jsPDF();

  doc.setFontSize(20);

  doc.text(
    "VALIDADE-",
    14,
    18
  );

  doc.setFontSize(13);

  doc.text(
    String(l.name).slice(
      0,
      45
    ),
    14,
    28
  );

  doc.setFontSize(9);

  doc.text(
    "Relatório de vencimentos",
    14,
    35
  );

  doc.text(
    "Data: " + l.created,
    150,
    35
  );

  let y = 48;

  doc.setFontSize(8);

  doc.text(
    "CÓDIGO DE BARRAS",
    14,
    y
  );

  doc.text(
    "DESCRIÇÃO",
    68,
    y
  );

  doc.text(
    "VALIDADE",
    142,
    y
  );

  doc.text(
    "QTD",
    182,
    y
  );

  y += 6;

  doc.line(
    14,
    y,
    196,
    y
  );

  y += 7;

  l.products.forEach(
    function(p){

      if(y > 280){

        doc.addPage();

        y = 20;

      }

      doc.text(
        String(p.bar).slice(
          0,
          20
        ),
        14,
        y
      );

      doc.text(
        String(p.name).slice(
          0,
          32
        ),
        68,
        y
      );

      doc.text(
        String(p.exp),
        142,
        y
      );

      doc.text(
        String(p.qty),
        182,
        y
      );

      y += 7;

    }
  );

  y += 5;

  doc.line(
    14,
    y,
    196,
    y
  );

  y += 7;

  doc.text(
    "Total de produtos: " +
    l.products.length,
    14,
    y
  );

  const nomeArquivo =
    String(l.name)
      .replace(
        /[^a-z0-9À-ÿ]+/gi,
        "-"
      );

  doc.save(
    "Validade-" +
    nomeArquivo +
    ".pdf"
  );

}

    current = null;

  }

}
