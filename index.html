<body>

<header>

  <h1>Validade-</h1>

  <p>Controle de vencimentos</p>

</header>

<main id="app">

  <section class="card">

    <h2>Carregando...</h2>

    <p class="muted">
      Inicializando aplicativo.
    </p>

  </section>

</main>


<script>

/* =====================================================
   BANCO LOCAL
===================================================== */

const KEY = "validade_app_v2";

let db = {
  lists:[]
};

let current = null;

let stream = null;

let scanTimer = null;

let scanStage = "barcode";

let ocrProcessing = false;


/* =====================================================
   CARREGAR DADOS
===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(KEY);

    if(saved){

      const parsed =
        JSON.parse(saved);

      if(
        parsed &&
        Array.isArray(parsed.lists)
      ){

        db = parsed;

      }

    }

  }catch(error){

    console.log(
      "Erro ao carregar dados:",
      error
    );

    db = {
      lists:[]
    };

  }

}


/* =====================================================
   SALVAR
===================================================== */

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(db)
    );

  }catch(error){

    console.log(
      "Erro ao salvar:",
      error
    );

  }

}


/* =====================================================
   ESCAPAR TEXTO
===================================================== */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m];

    }
  );

}


/* =====================================================
   APP
===================================================== */

function app(){

  return document.getElementById(
    "app"
  );

}


/* =====================================================
   TELA INICIAL
===================================================== */

function home(){

  stopCam();

  app().innerHTML = `

    <section class="card">

      <h2>Início</h2>

      <p class="muted">
        Controle seus produtos e datas de validade.
      </p>

      <div class="actions">

        <button
          class="primary"
          onclick="newList()">

          ➕ Criar nova lista

        </button>

        <button
          class="light"
          onclick="lists()">

          📋 Minhas listas

        </button>

        <button
          class="light"
          onclick="reports()">

          📄 Relatório final

        </button>

        <button
          class="danger"
          onclick="clearData()">

          🗑 Limpar dados

        </button>

      </div>

    </section>


    <section class="card">

      <b>Fluxo</b>

      <p class="muted">

        Criar lista →
        código de barras →
        descrição →
        validade →
        quantidade →
        salvar →
        finalizar.

      </p>

    </section>

  `;

}


/* =====================================================
   NOVA LISTA
===================================================== */

function newList(){

  app().innerHTML = `

    <section class="card">

      <div class="top">

        <h2>Nova lista</h2>

        <button
          class="back"
          onclick="home()">

          ← Voltar

        </button>

      </div>


      <label>

        Nome da lista

        <input
          id="lname"
          placeholder="Ex.: Câmara Fria – 11/09">

      </label>


      <button
        class="primary"
        onclick="createList()">

        Criar lista

      </button>

    </section>

  `;

}


/* =====================================================
   CRIAR LISTA
===================================================== */

function createList(){

  const input =
    document.getElementById(
      "lname"
    );

  if(!input){

    return;

  }

  const name =
    input.value.trim();

  if(!name){

    alert(
      "Digite o nome da lista."
    );

    return;

  }

  current = {

    id:Date.now(),

    name:name,

    created:
      new Date()
      .toLocaleDateString(
        "pt-BR"
      ),

    products:[]

  };

  editor();

}


/* =====================================================
   EDITOR
===================================================== */

function editor(){

  stopCam();

  if(!current){

    home();

    return;

  }

  app().innerHTML = `

    <section class="card">

      <div class="top">

        <div>

          <h2>
            ${esc(current.name)}
          </h2>

          <span class="badge">

            ${current.products.length}
            produto(s)

          </span>

        </div>

        <button
          class="back"
          onclick="home()">

          ← Início

        </button>

      </div>


      <div class="camera">

        <div
          id="cammsg"
          class="camera-title">

          A câmera será aberta para
          ler o código de barras.

        </div>


        <div class="video-wrap">

          <video
            id="video"
            autoplay
            playsinline
            muted
            class="hidden">
          </video>


          <div
            id="scanarea"
            class="scan-area hidden">

            <span>
              Posicione o produto nesta área
            </span>

          </div>


          <div
            id="scanline"
            class="scanline hidden">
          </div>

        </div>

      </div>


      <button
        id="scanbutton"
        class="primary"
        style="margin-top:10px"
        onclick="startScan()">

        📷 Ler Produto — código + descrição

      </button>


      <div
        id="scanstatus"
        class="status hidden"
        style="margin-top:10px">
      </div>


      <label>

        1️⃣ Código de barras

        <input
          id="pbar"
          inputmode="numeric"
          placeholder="Leia primeiro o código de barras">

      </label>


      <label>

        2️⃣ Descrição do produto

        <input
          id="pname"
          placeholder="Descrição do produto">

      </label>


      <div class="row">

        <label>

          3️⃣ Validade

          <input
            id="pexp"
            type="date">

        </label>


        <label>

          4️⃣ Quantidade

          <input
            id="pqty"
            type="number"
            min="1"
            value="1">

        </label>

      </div>


      <label>

        Setor

        <input
          id="psector"
          placeholder="Ex.: Câmara Fria">

      </label>


      <button
        class="green"
        onclick="addProduct()">

        💾 Salvar produto

      </button>


      <div
        style="margin-top:16px">

        <h3>
          Produtos desta lista
        </h3>

        <div id="products"></div>

      </div>


      <button
        class="primary"
        style="margin-top:15px"
        onclick="finishList()">

        ✅ Finalizar lista

      </button>

    </section>

  `;

  renderProducts();

}


/* =====================================================
   PRODUTOS
===================================================== */

function renderProducts(){

  const el =
    document.getElementById(
      "products"
    );

  if(!el || !current){

    return;

  }

  if(!current.products.length){

    el.innerHTML =
      '<p class="muted">Nenhum produto cadastrado ainda.</p>';

    return;

  }

  el.innerHTML =
    current.products
    .map(
      function(p,i){

        return `

          <div class="product">

            <b>
              ${i+1}.
              ${esc(p.bar)}
            </b>

            <br>

            ${esc(p.name)}

            <br>

            <span class="muted">

              Validade:
              ${esc(p.exp)}

              • Quantidade:
              ${p.qty}

              ${
                p.sector
                ? " • Setor: "
                  + esc(p.sector)
                : ""
              }

            </span>

          </div>

        `;

      }
    )
    .join("");

}


/* =====================================================
   INICIAR CÂMERA
===================================================== */

async function startScan(){

  const status =
    document.getElementById(
      "scanstatus"
    );

  const video =
    document.getElementById(
      "video"
    );

  const cammsg =
    document.getElementById(
      "cammsg"
    );

  if(!status || !video){

    return;

  }

  scanStage =
    "barcode";

  status.classList.remove(
    "hidden"
  );

  status.classList.remove(
    "processing"
  );

  status.textContent =
    "📷 Abrindo câmera para procurar o código de barras…";


  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      status.textContent =
        "⚠️ A câmera não está disponível neste aparelho.";

      return;

    }


    stopCam();


    stream =
      await navigator.mediaDevices
      .getUserMedia({

        audio:false,

        video:{

          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }

        }

      });


    video.srcObject =
      stream;

    video.classList.remove(
      "hidden"
    );


    const scanline =
      document.getElementById(
        "scanline"
      );

    const scanarea =
      document.getElementById(
        "scanarea"
      );


    if(scanline){

      scanline.classList.remove(
        "hidden"
      );

    }


    if(scanarea){

      scanarea.classList.remove(
        "hidden"
      );

    }


    if(cammsg){

      cammsg.textContent =
        "Aponte para o código de barras.";

    }


    if(
      "BarcodeDetector"
      in window
    ){

      let formats = [];


      try{

        formats =
          await BarcodeDetector
          .getSupportedFormats();

      }catch(error){

        formats = [];

      }


      let detector;


      try{

        detector =
          formats.length
          ? new BarcodeDetector({
              formats:formats
            })
          : new BarcodeDetector();

      }catch(error){

        detector =
          new BarcodeDetector();

      }


      scanTimer =
        setInterval(
          async function(){

            if(
              !video.videoWidth ||
              !video.videoHeight
            ){

              return;

            }


            try{

              const codes =
                await detector
                .detect(video);


              if(
                codes &&
                codes.length &&
                codes[0].rawValue
              ){

                const input =
                  document.getElementById(
                    "pbar"
                  );


                if(input){

                  input.value =
                    codes[0].rawValue;

                }


                nextOCR();

              }

            }catch(error){

            }

          },
          500
        );


    }else{

      status.textContent =
        "⚠️ Leitor automático indisponível. Digite o código manualmente.";

      if(cammsg){

        cammsg.textContent =
          "Digite o código de barras no campo abaixo.";

      }

    }

  }catch(error){

    console.log(
      "Erro câmera:",
      error
    );

    status.textContent =
      "⚠️ Não foi possível abrir a câmera. Verifique a permissão do aplicativo.";

  }

}


/* =====================================================
   PASSOU PARA OCR
===================================================== */

function nextOCR(){

  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer = null;

  }


  scanStage =
    "ocr";


  const status =
    document.getElementById(
      "scanstatus"
    );

  const cammsg =
    document.getElementById(
      "cammsg"
    );

  const scanarea =
    document.getElementById(
      "scanarea"
    );


  if(status){

    status.classList.remove(
      "hidden"
    );

    status.classList.remove(
      "processing"
    );

    status.textContent =
      "✅ Código lido! Agora aponte para o nome do produto.";

  }


  if(cammsg){

    cammsg.textContent =
      "Aponte o nome/descrição do produto para a área verde.";

  }


  if(scanarea){

    scanarea.classList.remove(
      "hidden"
    );

  }


  setTimeout(
    function(){

      ocrMode();

    },
    600
  );

}


/* =====================================================
   PREPARAR IMAGEM PARA OCR
===================================================== */

function prepararImagem(
  video,
  modo
){

  const largura =
    video.videoWidth;

  const altura =
    video.videoHeight;


  /*
    Região central da imagem.
    Evita pegar o restante da embalagem,
    código de barras e fundo.
  */

  const cropX =
    Math.floor(
      largura * 0.08
    );

  const cropY =
    Math.floor(
      altura * 0.20
    );

  const cropW =
    Math.floor(
      largura * 0.84
    );

  const cropH =
    Math.floor(
      altura * 0.50
    );


  const escala =
    2.5;


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    Math.floor(
      cropW * escala
    );

  canvas.height =
    Math.floor(
      cropH * escala
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  if(!ctx){

    return null;

  }


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.imageSmoothingEnabled =
    false;


  ctx.drawImage(

    video,

    cropX,
    cropY,
    cropW,
    cropH,

    0,
    0,
    canvas.width,
    canvas.height

  );


  const imagem =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const dados =
    imagem.data;


  for(
    let i = 0;
    i < dados.length;
    i += 4
  ){

    const r =
      dados[i];

    const g =
      dados[i + 1];

    const b =
      dados[i + 2];


    let cinza =
      (
        r * 0.299 +
        g * 0.587 +
        b * 0.114
      );


    /*
      Primeiro modo:
      contraste forte.
    */

    if(modo === 1){

      cinza =
        ((cinza - 128) * 1.65)
        + 128;

    }


    /*
      Segundo modo:
      preto/branco.
    */

    if(modo === 2){

      cinza =
        cinza > 145
        ? 255
        : 0;

    }


    cinza =
      Math.max(
        0,
        Math.min(
          255,
          cinza
        )
      );


    dados[i] =
      cinza;

    dados[i + 1] =
      cinza;

    dados[i + 2] =
      cinza;

  }


  ctx.putImageData(
    imagem,
    0,
    0
  );


  return canvas;

}


/* =====================================================
   LIMPAR TEXTO DO OCR
===================================================== */

function limparOCR(text){

  let resultado =
    String(
      text || ""
    );


  resultado =
    resultado
    .replace(/\r/g," ")
    .replace(/\n+/g," ")
    .replace(/\s+/g," ")
    .trim();


  /*
    Remove símbolos claramente estranhos.
  */

  resultado =
    resultado.replace(
      /[^A-Za-zÀ-ÿ0-9\s.,()\/&%+\-ºª°]/g,
      ""
    );


  resultado =
    resultado
    .replace(/\s+/g," ")
    .trim();


  /*
    Remove caracteres no começo.
  */

  resultado =
    resultado.replace(
      /^[^A-Za-zÀ-ÿ0-9]+/,
      ""
    );


  return resultado;

}


/* =====================================================
   AVALIAR TEXTO
===================================================== */

function avaliarTexto(
  texto,
  confianca
){

  const text =
    limparOCR(texto);


  if(!text){

    return {
      text:"",
      score:0
    };

  }


  const letras =
    (
      text.match(
        /[A-Za-zÀ-ÿ]/g
      ) || []
    ).length;


  const numeros =
    (
      text.match(
        /[0-9]/g
      ) || []
    ).length;


  const palavras =
    text
    .split(/\s+/)
    .filter(
      x => x.length >= 2
    )
    .length;


  let score =
    Number(
      confianca || 0
    );


  /*
    Recompensa texto com aparência
    de descrição de produto.
  */

  score +=
    Math.min(
      letras * 1.5,
      35
    );


  score +=
    Math.min(
      palavras * 3,
      20
    );


  /*
    Penaliza excesso de números.
  */

  if(
    numeros > letras
  ){

    score -= 25;

  }


  /*
    Penaliza textos muito curtos.
  */

  if(
    text.length < 5
  ){

    score -= 50;

  }


  return {

    text:text.slice(
      0,
      100
    ),

    score:score

  };

}


/* =====================================================
   OCR
===================================================== */

async function executarOCR(){

  const video =
    document.getElementById(
      "video"
    );


  if(
    !video ||
    !video.videoWidth
  ){

    return null;

  }


  const resultados = [];


  /*
    PRIMEIRA LEITURA
  */

  const imagem1 =
    prepararImagem(
      video,
      1
    );


  if(imagem1){

    try{

      const r1 =
        await Tesseract.recognize(

          imagem1,

          "por",

          {

            logger:function(){},

            tessedit_pageseg_mode:6

          }

        );


      resultados.push(
        avaliarTexto(
          r1?.data?.text,
          r1?.data?.confidence
        )
      );

    }catch(error){

      console.log(
        "OCR 1:",
        error
      );

    }

  }


  /*
    SEGUNDA LEITURA
    SOMENTE SE A PRIMEIRA
    NÃO FOR BOA
  */

  const melhor =
    resultados.length
    ? resultados[0]
    : null;


  if(
    !melhor ||
    melhor.score < 70
  ){

    const imagem2 =
      prepararImagem(
        video,
        2
      );


    if(imagem2){

      try{

        const r2 =
          await Tesseract.recognize(

            imagem2,

            "por",

            {

              logger:function(){},

              tessedit_pageseg_mode:6

            }

          );


        resultados.push(
          avaliarTexto(
            r2?.data?.text,
            r2?.data?.confidence
          )
        );

      }catch(error){

        console.log(
          "OCR 2:",
          error
        );

      }

    }

  }


  resultados.sort(
    function(a,b){

      return b.score - a.score;

    }
  );


  return resultados.length
    ? resultados[0]
    : null;

}


/* =====================================================
   MODO OCR
===================================================== */

function ocrMode(){

  if(!stream){

    return;

  }


  const button =
    document.getElementById(
      "scanbutton"
    );


  if(button){

    button.textContent =
      "📷 Ler descrição novamente";

  }


  if(!window.Tesseract){

    const status =
      document.getElementById(
        "scanstatus"
      );


    if(status){

      status.textContent =
        "⚠️ OCR indisponível. Digite a descrição manualmente.";

    }


    return;

  }


  const status =
    document.getElementById(
      "scanstatus"
    );


  if(status){

    status.textContent =
      "🔎 Procurando a descrição do produto…";

  }


  ocrProcessing =
    false;


  scanTimer =
    setInterval(
      async function(){

        if(ocrProcessing){

          return;

        }


        const video =
          document.getElementById(
            "video"
          );


        if(
          !video ||
          !video.videoWidth
        ){

          return;

        }


        ocrProcessing =
          true;


        if(status){

          status.classList.add(
            "processing"
          );

          status.textContent =
            "🔎 Analisando a embalagem…";

        }


        try{

          const resultado =
            await executarOCR();


          if(
            resultado &&
            resultado.text &&
            resultado.score >= 45
          ){

            const name =
              document.getElementById(
                "pname"
              );


            if(name){

              name.value =
                resultado.text;

            }


            if(status){

              status.classList.remove(
                "processing"
              );

              status.textContent =
                "✅ Descrição identificada. Confira e salve.";

            }


            stopCam();


          }else{

            if(status){

              status.textContent =
                "🔎 Aproxime o nome do produto e mantenha a câmera firme…";

            }

          }

        }catch(error){

          console.log(
            "Erro OCR:",
            error
          );

        }


        ocrProcessing =
          false;

      },
      2800
    );

}


/* =====================================================
   PARAR CÂMERA
===================================================== */

function stopCam(){

  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer =
      null;

  }


  ocrProcessing =
    false;


  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

    stream =
      null;

  }

}


/* =====================================================
   SALVAR PRODUTO
===================================================== */

function addProduct(){

  if(!current){

    return;

  }


  const name =
    document
    .getElementById(
      "pname"
    )
    .value
    .trim();


  const bar =
    document
    .getElementById(
      "pbar"
    )
    .value
    .trim();


  const exp =
    document
    .getElementById(
      "pexp"
    )
    .value;


  const qty =
    Number(
      document
      .getElementById(
        "pqty"
      )
      .value || 0
    );


  const sector =
    document
    .getElementById(
      "psector"
    )
    .value
    .trim();


  if(
    !name ||
    !bar ||
    !exp ||
    qty < 1
  ){

    alert(
      "Preencha descrição, código, validade e quantidade."
    );

    return;

  }


  current.products.push({

    name:name,

    bar:bar,

    exp:exp,

    qty:qty,

    sector:sector

  });


  save();

  editor();

}


/* =====================================================
   FINALIZAR LISTA
===================================================== */

function finishList(){

  stopCam();


  if(
    !current ||
    !current.products.length
  ){

    alert(
      "Cadastre pelo menos um produto antes de finalizar."
    );

    return;

  }


  const index =
    db.lists.findIndex(
      function(item){

        return item.id ===
          current.id;

      }
    );


  if(index < 0){

    db.lists.push(
      current
    );

  }else{

    db.lists[index] =
      current;

  }


  save();


  alert(
    "Lista salva no aparelho!"
  );


  current =
    null;


  home();

}

/* =====================================================
   GERAR PDF
===================================================== */

function generatePDF(id){

  const l =
    db.lists.find(
      function(item){

        return item.id === id;

      }
    );


  if(!l){

    return;

  }


  if(!window.jspdf){

    alert(
      "O gerador de PDF ainda está carregando. Tente novamente."
    );

    return;

  }


  const {
    jsPDF
  } =
    window.jspdf;


  const doc =
    new jsPDF();


  doc.setFontSize(
    20
  );

  doc.text(
    "VALIDADE-",
    14,
    18
  );


  doc.setFontSize(
    13
  );

  doc.text(
    String(l.name).slice(
      0,
      45
    ),
    14,
    28
  );


  doc.setFontSize(
    9
  );

  doc.text(
    "Relatório de vencimentos",
    14,
    35
  );


  doc.text(
    "Data: " + l.created,
    150,
    35
  );


  let y =
    48;


  doc.setFontSize(
    8
  );


  doc.text(
    "CÓDIGO DE BARRAS",
    14,
    y
  );


  doc.text(
    "DESCRIÇÃO",
    68,
    y
  );


  doc.text(
    "VALIDADE",
    142,
    y
  );


  doc.text(
    "QTD",
    182,
    y
  );


  y += 6;


  doc.line(
    14,
    y,
    196,
    y
  );


  y += 7;


  l.products.forEach(
    function(p){

      if(y > 280){

        doc.addPage();

        y = 20;

      }


      doc.text(
        String(p.bar)
          .slice(0,20),
        14,
        y
      );


      doc.text(
        String(p.name)
          .slice(0,32),
        68,
        y
      );


      doc.text(
        String(p.exp),
        142,
        y
      );


      doc.text(
        String(p.qty),
        182,
        y
      );


      y += 7;

    }
  );


  y += 5;


  doc.line(
    14,
    y,
    196,
    y
  );


  y += 7;


  doc.text(
    "Total de produtos: "
    + l.products.length,
    14,
    y
  );


  const nomeArquivo =
    String(l.name)
    .replace(
      /[^a-z0-9À-ÿ]+/gi,
      "-"
    );


  doc.save(
    "Validade-"
    + nomeArquivo
    + ".pdf"
  );

}
