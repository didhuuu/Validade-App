<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Validade-</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#071d49,#1265d8);
  color:white;
  padding:24px 18px 20px;
  border-radius:0 0 24px 24px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:5px 0 0;
  opacity:.85;
}

main{
  max-width:620px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 5px 18px #102a4d14;
}

button{
  border:0;
  border-radius:13px;
  padding:14px 16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#1265d8;
  color:white;
  width:100%;
}

.green{
  background:#16a36b;
  color:white;
  width:100%;
}

.light{

}

.danger{

}

.actions{
  display:grid;

}

.muted{

}

.hidden{

}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccd6e4;
  border-radius:11px;
  font-size:16px;

}

  display:block;
  margin:13px 0;
  font-weight:700;
  font-size:14px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;

}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.back{
  background:transparent;
  color:#1265d8;
  padding:5px 0;
}

.listbox{
  border:1px solid #dce4ef;
  border-radius:13px;
  padding:13px;
  margin:10px 0;
}

.product{
  border:1px solid #dce4ef;
  padding:12px;
  background:#f7f9fc;
  border-radius:12px;
  margin-top:10px;
}

.badge{
  display:inline-block;
  background:#e8f4ff;
  color:#1265d8;
  border-radius:20px;
  padding:5px 9px;
  font-size:12px;
}

.camera{
  background:#101722;
  border-radius:16px;
  padding:14px;
  color:white;
  text-align:center;
}

.camera-title{
  font-size:15px;
  margin-bottom:10px;
}

.video-wrap{
  position:relative;
}

video{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:11px;
  background:#05080d;
}

.scan-area{
  position:absolute;
  left:8%;

}

</head>

<body>

<header>
  <h1>Validade-</h1>
  <p>Controle de vencimentos</p>
</header>

<main id="app">

<section class="card">
  <h2>Carregando...</h2>
  <p class="muted">Inicializando aplicativo.</p>
</section>

</main>

<script>

/* =====================================================
   BANCO LOCAL
===================================================== */

const KEY = "validade_app_v3";

let db = {
  lists:[]
};

let current = null;
let stream = null;
let scanTimer = null;
let currentPhoto = "";


/* =====================================================
   CARREGAR
===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(KEY);

    if(saved){

      const parsed =
        JSON.parse(saved);

      if(
        parsed &&
        Array.isArray(parsed.lists)
      ){

        db = parsed;

      }

    }

  }catch(error){

    console.log(
      "Erro ao carregar:",
      error
    );

    db = {
      lists:[]
    };

  }

}


/* =====================================================
   SALVAR
===================================================== */

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(db)
    );

  }catch(error){

    console.log(
      "Erro ao salvar:",
      error
    );

    alert(
      "Não foi possível salvar os dados neste aparelho."
    );

  }

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m];

    });

}


/* =====================================================
   APP
===================================================== */

function app(){

  return document.getElementById("app");

}


/* =====================================================
   INÍCIO
===================================================== */

function home(){

  stopCam();

  current = null;
  currentPhoto = "";

  app().innerHTML = `

    <section class="card">

      <h2>Início</h2>

      <p class="muted">
        Controle seus produtos e datas de validade.
      </p>

      <div class="actions">

        <button
          class="primary"
          onclick="newList()">
          ➕ Criar nova lista
        </button>

        <button
          class="light"
          onclick="lists()">
          📋 Minhas listas
        </button>

        <button
          class="light"
          onclick="reports()">
          📄 Relatório final
        </button>

        <button
          class="danger"
          onclick="clearData()">
          🗑 Limpar dados
        </button>

      </div>

    </section>

    <section class="card">

      <b>Fluxo do aplicativo</b>

      <p class="muted">

        Criar lista →
        código de barras →
        foto do produto →
        validade →
        quantidade →
        salvar.

      </p>

    </section>

  `;

}


/* =====================================================
   NOVA LISTA
===================================================== */

function newList(){

  app().innerHTML = `

    <section class="card">

      <div class="top">

        <h2>Nova lista</h2>

        <button
          class="back"
          onclick="home()">
          ← Voltar
        </button>

      </div>

      <label>

        Nome da lista

        <input
          id="lname"
          placeholder="Ex.: Câmara Fria – 11/09">

      </label>

      <button
        class="primary"
        onclick="createList()">
        Criar lista
      </button>

    </section>

  `;

}


/* =====================================================
   CRIAR LISTA
===================================================== */

function createList(){

  const input =
    document.getElementById("lname");

  if(!input)
    return;

  const name =
    input.value.trim();

  if(!name){

    alert(
      "Digite o nome da lista."
    );

    return;

  }

  current = {

    id:Date.now(),

    name:name,

    created:new Date()
      .toLocaleDateString("pt-BR"),

    products:[]

  };

  currentPhoto = "";

  editor();

}


/* =====================================================
   EDITOR
===================================================== */

function editor(){

  stopCam();

  if(!current){

    home();

    return;

  }

  currentPhoto = "";

  app().innerHTML = `

    <section class="card">

      <div class="top">

        <div>

          <h2>
            ${esc(current.name)}
          </h2>

          <span class="badge">
            ${current.products.length}
            produto(s)
          </span>

        </div>

        <button
          class="back"
          onclick="home()">
          ← Início
        </button>

      </div>

      <hr>

      <div class="step">
        ETAPA 1 — Código de barras
      </div>

      <div class="camera">

        <div
          id="cammsg"
          class="camera-title">

          Aponte a câmera para o código de barras.

        </div>

        <div class="video-wrap">

          <video
            id="video"
            autoplay
            playsinline
            muted
            class="hidden">
          </video>

          <div
            id="scanarea"
            class="scan-area hidden">

            <span>
              Posicione o código nesta área
            </span>

          </div>

          <div
            id="scanline"
            class="scanline hidden">
          </div>

        </div>

      </div>

      <button
        id="scanbutton"
        class="primary"
        style="margin-top:10px"
        onclick="startScan()">

        📷 Ler código de barras

      </button>

      <div
        id="scanstatus"
        class="status hidden">
      </div>

      <label>

        Código de barras

        <input
          id="pbar"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="Somente números">

      </label>


      <div class="step">
        ETAPA 2 — Foto do produto
      </div>

      <div class="photo-box">

        <div class="photo-title">
          📸 Foto do produto
        </div>

        <div class="photo-help">

          Depois de ler o código, fotografe
          o produto/embalagem.

          <br><br>

          A foto será ajustada automaticamente
          para o formato horizontal de
          <b>60 × 25 mm</b>.

        </div>

        <input
          id="fotoProduto"
          type="file"
          accept="image/*"
          capture="environment"
          class="hidden"
          onchange="processarFotoProduto(this)">

        <button
          class="primary"
          style="margin-top:10px"
          onclick="abrirFotoProduto()">

          📸 Fotografar produto

        </button>

        <img
          id="photoPreview"
          class="photo-preview hidden"
          alt="Foto do produto">

      </div>


      <div class="step">
        ETAPA 3 — Validade e quantidade
      </div>

      <div class="row">

        <label>

          Validade

          <input
            id="pexp"
            type="date">

        </label>

        <label>

          Quantidade

          <input
            id="pqty"
            type="number"
            min="1"
            value="1">

        </label>

      </div>


      <label>

        Setor

        <input
          id="psector"
          placeholder="Ex.: Câmara Fria">

      </label>


      <button
        class="green"
        onclick="addProduct()">

        💾 Salvar produto

      </button>


      <div style="margin-top:18px">

        <h3>
          Produtos desta lista
        </h3>

        <div id="products"></div>

      </div>


      <button
        class="primary"
        style="margin-top:15px"
        onclick="finishList()">

        ✅ Finalizar lista

      </button>

    </section>

  `;

  renderProducts();

}


/* =====================================================
   PRODUTOS
===================================================== */

function renderProducts(){

  const el =
    document.getElementById("products");

  if(!el || !current)
    return;

  if(!current.products.length){

    el.innerHTML =
      '<p class="muted">Nenhum produto cadastrado ainda.</p>';

    return;

  }

  el.innerHTML =
    current.products
      .map(function(p,i){

        return `

          <div class="product">

            <div class="code-number">

              ${i+1}.
              ${esc(p.bar)}

            </div>

            ${
              p.photo
              ? `
                <img
                  src="${p.photo}"
                  class="report-photo"
                  alt="Produto">
              `
              : ""
            }

            <div>

              <b>Validade:</b>
              ${esc(formatDate(p.exp))}

            </div>

            <div>

              <b>Quantidade:</b>
              ${esc(p.qty)}

            </div>

            ${
              p.sector
              ? `
                <div class="muted">
                  Setor: ${esc(p.sector)}
                </div>
              `
              : ""
            }

          </div>

        `;

      })
      .join("");

}


/* =====================================================
   FORMATA DATA
===================================================== */

function formatDate(value){

  if(!value)
    return "";

  const parts =
    String(value).split("-");

  if(parts.length !== 3)
    return value;

  return (
    parts[2] +
    "/" +
    parts[1] +
    "/" +
    parts[0]
  );

}


/* =====================================================
   INICIAR CÂMERA DO CÓDIGO
===================================================== */

async function startScan(){

  const status =
    document.getElementById(
      "scanstatus"
    );

  const video =
    document.getElementById(
      "video"
    );

  const cammsg =
    document.getElementById(
      "cammsg"
    );

  if(!status || !video)
    return;

  status.classList.remove(
    "hidden"
  );

  status.classList.remove(
    "processing"
  );

  status.textContent =
    "📷 Abrindo câmera...";

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      status.textContent =
        "⚠️ A câmera não está disponível.";

      return;

    }

    stopCam();

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        audio:false,

        video:{

          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }

        }

      });

    video.srcObject =
      stream;

    video.classList.remove(
      "hidden"
    );

    const scanline =
      document.getElementById(
        "scanline"
      );

    const scanarea =
      document.getElementById(
        "scanarea"
      );

    if(scanline){

      scanline.classList.remove(
        "hidden"
      );

    }

    if(scanarea){

      scanarea.classList.remove(
        "hidden"
      );

    }

    if(cammsg){

      cammsg.textContent =
        "Aponte para o código de barras.";

    }

    status.textContent =
      "🔎 Procurando código de barras...";


    if(
      !("BarcodeDetector" in window)
    ){

      status.textContent =
        "⚠️ O leitor automático não está disponível. Digite o código manualmente.";

      return;

    }


    let formats = [];

    try{

      formats =
        await BarcodeDetector
        .getSupportedFormats();

    }catch(error){

      formats = [];

    }


    let detector;

    try{

      detector =
        formats.length
        ? new BarcodeDetector({
            formats:formats
          })
        : new BarcodeDetector();

    }catch(error){

      detector =
        new BarcodeDetector();

    }


    scanTimer =
      setInterval(
        async function(){

          if(
            !video.videoWidth ||
            !video.videoHeight
          ){

            return;

          }

          try{

            const codes =
              await detector.detect(
                video
              );

            if(
              codes &&
              codes.length &&
              codes[0].rawValue
            ){

              let codigo =
                String(
                  codes[0].rawValue
                );

              /*
                IMPORTANTE:
                guardar somente números
              */

              codigo =
                codigo.replace(
                  /\D/g,
                  ""
                );

              if(!codigo){

                return;

              }

              const input =
                document.getElementById(
                  "pbar"
                );

              if(input){

                input.value =
                  codigo;

              }

              clearInterval(
                scanTimer
              );

              scanTimer = null;

              stopCameraTracksOnly();

              status.textContent =
                "✅ Código lido: " +
                codigo;

              if(cammsg){

                cammsg.textContent =
                  "Código lido. Agora fotografe o produto.";

              }

            }

          }catch(error){

            console.log(
              "Erro no leitor:",
              error
            );

          }

        },
        350
      );

  }catch(error){

    console.log(
      "Erro câmera:",
      error
    );

    status.textContent =
      "⚠️ Não foi possível abrir a câmera. Verifique a permissão.";

  }

}


/* =====================================================
   ABRIR FOTO
===================================================== */

function abrirFotoProduto(){

  const codigo =
    document.getElementById(
      "pbar"
    );

  if(
    !codigo ||
    !codigo.value.trim()
  ){

    alert(
      "Leia primeiro o código de barras."
    );

    return;

  }

  const input =
    document.getElementById(
      "fotoProduto"
    );

  if(input){

    input.value = "";

    input.click();

  }

}


/* =====================================================
   LER ARQUIVO COMO IMAGEM
===================================================== */

function carregarImagem(
  arquivo
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const img =
            new Image();

          img.onload =
            function(){

              resolve(img);

            };

          img.onerror =
            reject;

          img.src =
            reader.result;

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        arquivo
      );

    }
  );

}


/* =====================================================
   PREPARAR FOTO 60 x 25 MM
   PROPORÇÃO 2.4 : 1
===================================================== */

async function processarFotoProduto(
  input
){

  if(
    !input ||
    !input.files ||
    !input.files.length
  ){

    return;

  }

  const status =
    document.getElementById(
      "scanstatus"
    );

  if(status){

    status.classList.remove(
      "hidden"
    );

    status.classList.add(
      "processing"
    );

    status.textContent =
      "📸 Preparando foto do produto...";

  }

  try{

    const imagem =
      await carregarImagem(
        input.files[0]
      );


    /*
      Proporção física:
      60 / 25 = 2.4
    */

    const ratio =
      60 / 25;


    let largura =
      imagem.naturalWidth ||
      imagem.width;

    let altura =
      imagem.naturalHeight ||
      imagem.height;


    /*
      Recorte central para 2.4:1
    */

    let cropWidth =
      largura;

    let cropHeight =
      Math.round(
        largura / ratio
      );


    if(cropHeight > altura){

      cropHeight =
        altura;

      cropWidth =
        Math.round(
          altura * ratio
        );

    }


    const sx =
      Math.round(
        (largura - cropWidth) / 2
      );

    const sy =
      Math.round(
        (altura - cropHeight) / 2
      );


    /*
      Tamanho interno de boa qualidade.
      A proporção continua exatamente 2.4:1.
    */

    const outputWidth =
      1200;

    const outputHeight =
      500;


    const canvas =
      document.createElement(
        "canvas"
      );

    canvas.width =
      outputWidth;

    canvas.height =
      outputHeight;


    const ctx =
      canvas.getContext(
        "2d"
      );

    if(!ctx){

      throw new Error(
        "Canvas indisponível."
      );

    }


    ctx.drawImage(
      imagem,
      sx,
      sy,
      cropWidth,
      cropHeight,
      0,
      0,
      outputWidth,
      outputHeight
    );


    /*
      JPEG comprimido para não
      deixar o armazenamento pesado.
    */

    currentPhoto =
      canvas.toDataURL(
        "image/jpeg",
        0.82
      );


    const preview =
      document.getElementById(
        "photoPreview"
      );

    if(preview){

      preview.src =
        currentPhoto;

      preview.classList.remove(
        "hidden"
      );

    }


    if(status){

      status.classList.remove(
        "processing"
      );

      status.textContent =
        "✅ Foto preparada no formato 60 × 25 mm.";

    }

  }catch(error){

    console.log(
      "Erro ao preparar foto:",
      error
    );

    currentPhoto = "";

    if(status){

      status.classList.remove(
        "processing"
      );

      status.textContent =
        "⚠️ Não foi possível preparar a foto.";

    }

  }

}


/* =====================================================
   PARAR SOMENTE OS TRACKS
===================================================== */

function stopCameraTracksOnly(){

  if(stream){

    stream
      .getTracks()
      .forEach(function(track){

        track.stop();

      });

    stream = null;

  }

}


/* =====================================================
   PARAR CÂMERA
===================================================== */

function stopCam(){

  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer = null;

  }

  stopCameraTracksOnly();

}


/* =====================================================
   ADICIONAR PRODUTO
===================================================== */

function addProduct(){

  if(!current)
    return;


  const barInput =
    document.getElementById(
      "pbar"
    );

  const expInput =
    document.getElementById(
      "pexp"
    );

  const qtyInput =
    document.getElementById(
      "pqty"
    );

  const sectorInput =
    document.getElementById(
      "psector"
    );


  /*
    Código:
    somente números
  */

  const bar =
    String(
      barInput?.value || ""
    )
    .replace(
      /\D/g,
      ""
    );


  const exp =
    expInput?.value || "";


  const qty =
    Number(
      qtyInput?.value || 0
    );


  const sector =
    String(
      sectorInput?.value || ""
    ).trim();


  if(!bar){

    alert(
      "Leia o código de barras."
    );

    return;

  }


  if(!currentPhoto){

    alert(
      "Fotografe o produto antes de salvar."
    );

    return;

  }


  if(!exp){

    alert(
      "Informe a validade."
    );

    return;

  }


  if(qty < 1){

    alert(
      "Informe uma quantidade válida."
    );

    return;

  }


  current.products.push({

    bar:bar,

    photo:currentPhoto,

    exp:exp,

    qty:qty,

    sector:sector

  });


  save();

  currentPhoto = "";

  editor();

}


/* =====================================================
   FINALIZAR
===================================================== */

function finishList(){

  stopCam();

  if(
    !current ||
    !current.products.length
  ){

    alert(
      "Cadastre pelo menos um produto antes de finalizar."
    );

    return;

  }


  const index =
    db.lists.findIndex(
      function(item){

        return item.id === current.id;

      }
    );


  if(index < 0){

    db.lists.push(
      current
    );

  }else{

    db.lists[index] =
      current;

  }


  save();

  alert(
    "Lista salva no aparelho!"
  );

  current = null;
  currentPhoto = "";

  home();

}

/* =====================================================
   GERAR PDF
===================================================== */

function generatePDF(id){

  const l =
    db.lists.find(
      function(item){

        return item.id === id;

      }
    );

  if(!l)
    return;


  if(!window.jspdf){

    alert(
      "O gerador de PDF ainda está carregando. Tente novamente."
    );

    return;

  }


  const jsPDF =
    window.jspdf.jsPDF;


  const doc =
    new jsPDF({
      orientation:"portrait",
      unit:"mm",
      format:"a4"
    });


  doc.setFontSize(20);

  doc.text(
    "VALIDADE-",
    14,
    18
  );


  doc.setFontSize(13);

  doc.text(
    String(l.name).slice(
      0,
      45
    ),
    14,
    27
  );


  doc.setFontSize(9);

  doc.text(
    "Relatório de vencimentos",
    14,
    34
  );

  doc.text(
    "Data: " + l.created,
    150,
    34
  );


  let y = 44;


  l.products.forEach(
    function(p,index){

      /*
        Cada produto ocupa uma área.
        A foto é inserida fisicamente em
        exatamente 60 x 25 mm.
      */

      const blockHeight =
        45;


      if(
        y + blockHeight > 285
      ){

        doc.addPage();

        y = 20;

      }


      doc.setFontSize(10);

      doc.text(
        String(index + 1) +
        ". Código: " +
        String(p.bar),
        14,
        y
      );


      y += 5;


      if(p.photo){

        try{

          doc.addImage(
            p.photo,
            "JPEG",
            14,
            y,
            60,
            25
          );

        }catch(error){

          console.log(
            "Erro ao inserir foto:",
            error
          );

        }

      }


      const infoX =
        82;


      doc.setFontSize(9);

      doc.text(
        "Validade:",
        infoX,
        y + 6
      );

      doc.text(
        String(
          formatDate(p.exp)
        ),
        infoX + 22,
        y + 6
      );


      doc.text(
        "Quantidade:",
        infoX,
        y + 13
      );

      doc.text(
        String(p.qty),
        infoX + 25,
        y + 13
      );


      if(p.sector){

        doc.text(
          "Setor:",
          infoX,
          y + 20
        );

        doc.text(
          String(
            p.sector
          ).slice(
            0,
            30
          ),
          infoX + 15,
          y + 20
        );

      }


      y += 33;


      doc.setDrawColor(
        210,
        218,
        230
      );

      doc.line(
        14,
        y,
        196,
        y
      );


      y += 8;

    }
  );


  doc.setFontSize(9);

  doc.text(
    "Total de produtos: " +
    l.products.length,
    14,
    Math.min(y,285)
  );


  const nomeArquivo =
    String(l.name)
      .replace(
        /[^a-z0-9À-ÿ]+/gi,
        "-"
      );


  doc.save(
    "Validade-" +
    nomeArquivo +
    ".pdf"
  );

}
